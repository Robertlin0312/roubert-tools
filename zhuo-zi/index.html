<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="https://robertlin0312.github.io/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="https://robertlin0312.github.io/apple-touch-icon.png">
<title>灼字 Burnt Glyph</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+Hei+HK:wght@400;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: control rack on the left, poster stage on the right; stacks on phones (stage first). */
:root{
  --bg:#0b0a0c; --panel:#121014; --line:#2a2530; --fg:#e9e4ea; --dim:#8d8592;
  --accent:#ff4a1c; --accent-2:#f3cd12; --field:#1b181e; --stage:#060507;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-ui="light"]{
  --bg:#ece8e3; --panel:#f6f3ef; --line:#d4cdc5; --fg:#1c1a1d; --dim:#6f6870;
  --accent:#d8360f; --accent-2:#a37c00; --field:#ffffff; --stage:#d9d4ce; color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:12px/1.4 var(--ui);overflow:hidden}
#app{display:grid;grid-template-columns:330px 1fr;height:100%}
#panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;padding-block:12px 40px}
#stage{position:relative;background:var(--stage);display:flex;flex-direction:column;min-width:0;min-height:0}
#view{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px;position:relative}
#gl{display:block;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.45);touch-action:none;cursor:crosshair}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:6px}
h1{font:600 15px/1 var(--mono);letter-spacing:.32em;margin:0}
h1 b{color:var(--accent);font-weight:600}
.sub{font:10px var(--mono);color:var(--dim);letter-spacing:.12em;margin:4px 0 10px}
.tbtns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
button,.btn{font:11px var(--mono);color:var(--fg);background:var(--field);border:1px solid var(--line);
  padding:5px 8px;border-radius:2px;cursor:pointer;letter-spacing:.04em;white-space:nowrap}
button:hover{border-color:var(--dim)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.hot{background:var(--accent);border-color:var(--accent);color:#fff}
details{border-top:1px solid var(--line);padding:8px 0}
summary{font:600 11px var(--mono);letter-spacing:.18em;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;color:var(--fg);text-transform:uppercase}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:8px;height:8px;background:var(--line);flex:none}
details[open] summary::before{background:var(--accent)}
summary .zh{font-family:var(--ui);letter-spacing:.1em;text-transform:none}
.sec{display:grid;gap:7px;margin-top:9px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px}
.row label{color:var(--dim);font-size:11px}
.row .val{font:10px var(--mono);color:var(--fg);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:var(--accent);height:14px}
.row.full{grid-template-columns:1fr}
select,input[type=text],textarea{font:12px var(--ui);color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:2px;padding:5px 6px;width:100%;box-sizing:border-box}
textarea{resize:vertical;min-height:58px;font-size:14px;line-height:1.35}
.seg{display:flex;flex-wrap:wrap;gap:3px}
.seg button{flex:1 1 auto;padding:4px 6px}
.tog{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--fg);font-size:11.5px}
.tog input{accent-color:var(--accent);margin:0}
.colors{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.colors label{display:grid;gap:3px;font-size:10px;color:var(--dim);text-align:center}
.colors input{width:100%;height:26px;border:1px solid var(--line);background:none;padding:0;border-radius:2px;cursor:pointer}
.swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.sw{display:flex;align-items:center;gap:6px;padding:4px;text-align:left}
.sw i{display:flex;height:12px;width:46px;flex:none}
.sw i span{flex:1}
.btnrow{display:flex;flex-wrap:wrap;gap:4px}
.btnrow button{flex:1 1 auto}
#bar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));flex-wrap:wrap}
#tl{flex:1 1 160px;accent-color:var(--accent);min-width:100px}
#time{font:10px var(--mono);color:var(--dim);min-width:84px;text-align:right;font-variant-numeric:tabular-nums}
#hud{position:absolute;left:18px;top:10px;font:10px var(--mono);color:var(--dim);letter-spacing:.08em;pointer-events:none}
#rec{position:absolute;right:18px;top:10px;font:10px var(--mono);color:#fff;background:var(--accent);padding:3px 7px;display:none}
#tip{position:fixed;z-index:50;max-width:240px;background:var(--fg);color:var(--bg);font-size:11px;line-height:1.45;padding:6px 8px;border-radius:2px;pointer-events:none;display:none}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:7px 12px;font-size:12px;border-radius:2px;display:none;z-index:60}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:12px var(--mono);color:var(--accent);text-align:center;padding:20px}
.drop #view::after{content:attr(data-drop);position:absolute;inset:10px;border:1px dashed var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent);font:12px var(--mono);background:rgba(0,0,0,.4)}
.note{font-size:10.5px;color:var(--dim);line-height:1.5}
.hidden{display:none!important}
body.nopanel #app{grid-template-columns:0 1fr}
body.nopanel #panel{display:none}
@media (max-width:820px){
  body{overflow:auto}
  #app{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto}
  #stage{order:-1;height:72vh;position:sticky;top:0;z-index:5}
  #panel{border-right:0;overflow:visible;padding-right:max(12px,env(safe-area-inset-right,0px))}
  #view{padding:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <header class="top">
      <div>
        <h1>灼字 <b>BURNT</b></h1>
      </div>
      <div class="tbtns">
        <button id="bLang" data-tip="tLang">EN</button>
        <button id="bTips" class="on" data-tip="tTips">說明</button>
        <button id="bTheme" data-tip="tTheme">◐</button>
        <button id="bReset" data-tip="tReset">重設</button>
      </div>
    </header>
    <div class="sub" data-i18n="sub">中文熱像流體海報工具 · v1.0</div>
    <div id="ui"></div>
  </aside>
  <main id="stage">
    <div id="view" data-drop="放開以載入圖片／SVG／字型">
      <canvas id="gl" aria-label="poster"></canvas>
      <div id="hud"></div>
      <div id="rec">● REC</div>
      <div id="err">此工具需要支援 WebGL2 的瀏覽器（Chrome、Safari 15+、Firefox）。<br>WEBGL2 UNAVAILABLE</div>
    </div>
    <div id="bar">
      <button id="bPlay" data-tip="tPlay">❚❚</button>
      <button id="bRestart" data-tip="tRestart">⟲</button>
      <input id="tl" type="range" min="0" max="1000" value="0" aria-label="timeline" data-tip="tTimeline">
      <span id="time">0.0 / 8.0s</span>
      <button id="bRecLoop" data-tip="tRecLoop">錄一輪</button>
      <button id="bRec" data-tip="tRec">● 錄影</button>
      <button id="bPng" class="hot" data-tip="tPng">PNG</button>
    </div>
  </main>
</div>
<div id="tip"></div>
<div id="toast"></div>
<input type="file" id="fImg" accept="image/*,.svg" hidden>
<input type="file" id="fFont" accept=".ttf,.otf,.woff,.woff2" hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>

<script>
"use strict";
/* ═════════════════════════════════════════════════════════════════
   灼字 Burnt Glyph — v1.0
   Thermal-fluid poster generator for Chinese type. Pipeline per frame:
   mask → fluid (feedback) → melt sim → core → glow pyramid → thermal ramp → lens/post
   ═════════════════════════════════════════════════════════════════ */

/* ─── 1. Parameter state ─────────────────────────────────────────── */
const DEF = {
  // content
  contentType:'text', text:'野火\n燒不盡', font:'noto-sans', weight:900, writing:'h', align:'center',
  fontSize:0.92, tracking:0.04, leading:1.22, bold:0.012, posX:0, posY:0, margin:0.08,
  imgMode:'dark', imgThresh:0.5, imgInvert:false, assetScale:0.9,
  edgeBlur:5, meltSource:true, separate:true, drip:true, dripAmount:0.5,
  // motion
  mode:'auto', preset:'drift', direction:'ttb', loop:'wrap', easing:'easein', cycle:8,
  brushRadius:0.14, smear:0.24, persistence:0.93, warp:0.19, warpScale:4.7, sweepSoft:0.12,
  // thermal
  burnOn:true, palette:'thermal', ground:'#050208', secondary:'#0f2da3', primary:'#57beff', burn:'#f3cd12', core:'#ff4000',
  blend:'screen', exposure:1.0, glowSoft:16, glowAmt:1.0, rgbSplit:0.006,
  // melt
  melt:0.008, meltType:1.0, meltSpeed:1.6, meltHeat:1.5, meltScale:7, meltPoint:0.78,
  meltGravity:0.75, meltVisc:4.0, meltTension:0.06, meltSpread:30,
  // post
  postOn:true, lensBlur:0.018, lensMode:'partial', lensFocus:0.42, lensRange:0.6, lensHi:5,
  lensEdge:0.45, lensDistort:-0.2, lensFringe:0.0, lensQuality:'auto',
  grain:0.06, grainSize:2, thresh:0.0, contrast:1.35,
  // poster info
  metaOn:false, kicker:'2026 秋季製作', date:'2026.11.14 — 11.16', label:'演出', subtitle:'燒不盡\n一齣關於火的偶戲\n導演　林某某',
  serial:'No. 0417 / 500', metaFont:'noto-sans', metaScale:1.0, metaTrack:0.12, metaWeight:700, ink:'#f4f2ee', textMode:0,
  // system
  aspect:'2:3', quality:'mid', exportH:2400, seed:445.37,
};
let P = JSON.parse(JSON.stringify(DEF));
const STORE_KEY = 'zhuozi.v1';
let LANG = 'zh';
let TIPS = true;

const FONTS = {
  'noto-sans':  {fam:'"Noto Sans TC"', zh:'思源黑體', en:'Noto Sans TC'},
  'noto-serif': {fam:'"Noto Serif TC"', zh:'思源宋體', en:'Noto Serif TC'},
  'wenkai':     {fam:'"LXGW WenKai TC"', zh:'霞鶩文楷', en:'LXGW WenKai'},
  'chiron':     {fam:'"Chiron Hei HK"', zh:'昭源黑體', en:'Chiron Hei HK'},
  'system':     {fam:'"PingFang TC","Heiti TC","Microsoft JhengHei"', zh:'系統字體', en:'System'},
};
const FALLBACK = ',"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
let customFonts = {};   // key -> family name

const PALETTES = {
  thermal: {zh:'熱像', en:'Thermal', c:['#050208','#0f2da3','#57beff','#f3cd12','#ff4000'], blend:'screen'},
  neon:    {zh:'霓虹', en:'Neon',    c:['#07020a','#3a0b6e','#ff2bd6','#ffe14d','#ff1d4e'], blend:'screen'},
  cinnabar:{zh:'硃砂', en:'Cinnabar',c:['#0a0303','#3b0606','#c4161c','#ff9a3c','#fff1d6'], blend:'screen'},
  night:   {zh:'夜視', en:'Night vision', c:['#010603','#06311a','#1fd16b','#e9ff6b','#ffffff'], blend:'screen'},
  cyan:    {zh:'藍晒', en:'Cyanotype', c:['#02060f','#0b1f5c','#2f6bff','#9fd8ff','#ffffff'], blend:'screen'},
  stage:   {zh:'舞台黃', en:'Stage amber', c:['#070503','#3a1d05','#d9720b','#ffd23f','#fff8e6'], blend:'screen'},
  riso:    {zh:'Riso 紙', en:'Riso paper', c:['#f1ece2','#7fb4e0','#0b4fa6','#ff48b0','#1b1a1f'], blend:'normal'},
  ink:     {zh:'宣紙墨', en:'Ink on paper', c:['#efe8da','#c9bfae','#7a6e60','#2b2622','#0c0b0a'], blend:'normal'},
};

/* ─── 2. i18n strings ────────────────────────────────────────────── */
const T = {
  sub:['中文熱像流體海報工具 · v1.0','Thermal fluid poster tool for CJK type · v1.0'],
  tLang:['切換介面語言','Switch interface language'],
  tTips:['開關滑鼠懸停說明','Toggle hover tips'],
  tTheme:['介面深色／淺色（不影響海報）','UI dark / light (poster unaffected)'],
  tReset:['所有參數回到預設值','Reset every parameter to default'],
  tPlay:['播放／暫停（空白鍵）','Play / pause (Space)'],
  tRestart:['從頭開始一輪（R）','Restart the cycle (R)'],
  tTimeline:['拖曳跳到這一輪的任一時間點（會重新模擬到該處）','Scrub to any point in the cycle (re-simulates up to there)'],
  tRecLoop:['從頭錄剛好一輪，適合做成循環影片','Record exactly one cycle from the start — for seamless loops'],
  tRec:['開始／停止錄影（V）。Chrome／Safari 會存成 MP4，否則 WebM','Start / stop recording (V). MP4 where supported, else WebM'],
  tPng:['以輸出尺寸存 PNG（S）','Save PNG at export size (S)'],
  play:['❚❚','❚❚'], pause:['▶','▶'],
  recLoop:['錄一輪','Rec loop'], rec:['● 錄影','● Rec'], recStop:['■ 停止','■ Stop'],
  drop:['放開以載入圖片／SVG／字型','Drop image / SVG / font'],
  saved:['已存檔','Saved'], loaded:['已載入','Loaded'], fontLoaded:['字型已載入：','Font loaded: '],
  noRec:['這個瀏覽器不支援錄影','Recording not supported in this browser'],
  resetDone:['已重設','Reset'],
  tips:['說明','Tips'], reset:['重設','Reset'],
};
const tr = k => (T[k] ? T[k][LANG==='zh'?0:1] : k);
const L = (zh,en) => [zh,en];

/* ─── 3. UI schema ───────────────────────────────────────────────── */
const fontOpts = () => [...Object.entries(FONTS).map(([k,v])=>[k,[v.zh,v.en]]), ...Object.keys(customFonts).map(k=>[k,[k,k]])];
const SCHEMA = [
 {id:'content', t:L('內容','Content'), open:true, items:[
  {k:'contentType', type:'seg', l:L('來源','Source'), o:[['text',L('文字','Text')],['image',L('圖片','Image')],['svg',L('SVG','SVG')]], tip:L('用文字、點陣圖或 SVG 當作要燃燒的形狀','Use text, a bitmap or an SVG as the burning shape'), mask:1},
  {k:'text', type:'textarea', l:L('文字（換行＝分行）','Text (newline = new line)'), show:()=>P.contentType==='text', mask:1, tip:L('中文字越少、越粗，效果越好。直排時每一行是一欄','Fewer, heavier characters burn best. In vertical mode each line is a column')},
  {k:'font', type:'select', l:L('字型','Font'), o:fontOpts, show:()=>P.contentType==='text', mask:1, tip:L('思源黑體 Black 最適合；可以上傳自己的字型','Noto Sans TC Black works best; you can upload your own font')},
  {type:'buttons', show:()=>P.contentType==='text', b:[[L('上傳字型…','Upload font…'),()=>$('#fFont').click()]]},
  {k:'weight', type:'seg', l:L('字重','Weight'), o:[[400,L('Regular','Regular')],[700,L('Bold','Bold')],[900,L('Black','Black')]], show:()=>P.contentType==='text', mask:1, tip:L('有些字型沒有 Black，會自動用最接近的字重','Fonts without Black fall back to the nearest weight')},
  {k:'writing', type:'seg', l:L('排列','Direction'), o:[['h',L('橫排','Horizontal')],['v',L('直排','Vertical')]], show:()=>P.contentType==='text', mask:1, tip:L('直排由右至左排欄，括號與破折號會換成直排字形','Vertical runs right-to-left; brackets and dashes switch to vertical forms')},
  {k:'align', type:'seg', l:L('對齊','Align'), o:[['start',L('起','Start')],['center',L('中','Center')],['end',L('末','End')]], show:()=>P.contentType==='text', mask:1},
  {k:'fontSize', type:'range', l:L('字級','Size'), min:0.3, max:2.2, step:0.01, f:'x', show:()=>P.contentType==='text', mask:1, tip:L('1.0＝剛好撐滿邊界；超過會出血','1.0 fits the margins; above that it bleeds')},
  {k:'tracking', type:'range', l:L('字距','Tracking'), min:-0.3, max:0.8, step:0.005, show:()=>P.contentType==='text', mask:1},
  {k:'leading', type:'range', l:L('行距','Leading'), min:0.6, max:2.2, step:0.01, show:()=>P.contentType==='text', mask:1},
  {k:'bold', type:'range', l:L('筆畫加粗','Stroke weight'), min:0, max:0.12, step:0.001, show:()=>P.contentType==='text', mask:1, tip:L('中文筆畫比英文細，加粗後融化時字的內部才不會被吃掉','CJK strokes are thin; thickening them keeps glyph interiors from melting away')},
  {k:'imgMode', type:'seg', l:L('形狀取自','Shape from'), o:[['dark',L('暗部','Darks')],['light',L('亮部','Lights')],['alpha',L('透明度','Alpha')]], show:()=>P.contentType!=='text', mask:1, tip:L('白底黑字的圖選「暗部」；去背 PNG 或 SVG 選「透明度」','Black-on-white images: Darks. Cut-out PNG or SVG: Alpha')},
  {k:'imgThresh', type:'range', l:L('門檻','Threshold'), min:0, max:1, step:0.01, show:()=>P.contentType!=='text' && P.imgMode!=='alpha', mask:1},
  {k:'assetScale', type:'range', l:L('圖片大小','Image scale'), min:0.2, max:2, step:0.01, f:'x', show:()=>P.contentType!=='text', mask:1},
  {type:'buttons', show:()=>P.contentType!=='text', b:[[L('上傳圖片／SVG…','Upload image / SVG…'),()=>$('#fImg').click()]]},
  {k:'posX', type:'range', l:L('水平位置','Offset X'), min:-0.5, max:0.5, step:0.005, mask:1},
  {k:'posY', type:'range', l:L('垂直位置','Offset Y'), min:-0.5, max:0.5, step:0.005, mask:1},
  {k:'margin', type:'range', l:L('邊界','Margin'), min:0, max:0.3, step:0.005, mask:1},
  {k:'edgeBlur', type:'range', l:L('邊緣柔化','Edge blur'), min:0, max:24, step:0.5, mask:1, tip:L('太大會讓相鄰的字黏成一團','Too much and neighbouring glyphs fuse')},
  {k:'meltSource', type:'toggle', l:L('讓字本身融化','Melt the source shape'), tip:L('開：字形從流體裡讀出，可以滴落、消散。關：原字一直清楚地壓在最上層','On: the glyph is read from the fluid so it can drip away. Off: the crisp glyph stays on top')},
  {k:'separate', type:'toggle', l:L('字與字分開','Keep glyphs separate'), tip:L('收緊邊緣，讓字間的空隙保持暗色，不會糊在一起','Tightens the falloff so the gaps between glyphs stay dark')},
  {k:'drip', type:'toggle', l:L('滴落','Water drip')},
  {k:'dripAmount', type:'range', l:L('滴落強度','Drip amount'), min:0, max:2, step:0.01, show:()=>P.drip},
 ]},

/* ─── 4. GL setup ────────────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const cv = $('#gl');
const gl = cv.getContext('webgl2', {antialias:false, alpha:false, premultipliedAlpha:false, preserveDrawingBuffer:false});
if (!gl){ $('#err').style.display='flex'; throw new Error('WebGL2 unavailable'); }
gl.getExtension('EXT_color_buffer_float');
gl.getExtension('EXT_color_buffer_half_float');
gl.getExtension('OES_texture_float_linear');

/* pick the best renderable format: RGBA16F if we can draw into it, else RGBA8 (with dither) */
let FMT = {internal:gl.RGBA8, format:gl.RGBA, type:gl.UNSIGNED_BYTE, half:false};
(function probe(){
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, 4, 4, 0, gl.RGBA, gl.HALF_FLOAT, null);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE)
    FMT = {internal:gl.RGBA16F, format:gl.RGBA, type:gl.HALF_FLOAT, half:true};
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(f); gl.deleteTexture(t);
})();
const FMT8 = {internal:gl.RGBA8, format:gl.RGBA, type:gl.UNSIGNED_BYTE, half:false};

const VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;

const HEAD = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
`;
const NOISE = `
float hash11(float p){ p=fract(p*0.1031); p*=p+33.33; p*=p+p; return fract(p); }
float hash21(vec2 p){ vec3 q=fract(vec3(p.xyx)*0.1031); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
float vnoise(vec2 p){
  vec2 i=floor(p), f=fract(p); vec2 u=f*f*f*(f*(f*6.0-15.0)+10.0);
  return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x), mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x), u.y);
}
float fbm(vec2 p){
  float v=0.0, a=0.5; mat2 R=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=R*p; a*=0.5; }
  return v;
}
float luma(vec3 c){ return dot(c, vec3(0.2126,0.7152,0.0722)); }
`;
/* reveal / erase wipe — c is 0 at the start edge and 1 at the far edge */
const SWEEP = `
uniform float uReveal, uHide, uSoft, uHideRev, uRadial;
uniform vec2 uAxis; uniform float uBias; uniform float uAspect;
float sweepMask(vec2 uv){
  float lin = uBias + dot(uv, uAxis);
  vec2 d = uv-0.5; d.x *= uAspect;
  float rad = length(d) / length(vec2(0.5*uAspect,0.5));
  float c = mix(lin, abs(uRadial-1.0) < 0.5 ? rad : 1.0-rad, step(0.5, uRadial));
  float s = max(uSoft, 0.0005);
  float pr = uReveal*(1.0+2.0*s) - s;
  float ph = uHide*(1.0+2.0*s) - s;
  float r = 1.0 - smoothstep(pr-s, pr+s, c);
  float ch = mix(c, 1.0-c, uHideRev);
  float h = smoothstep(ph-s, ph+s, ch);
  return r*h;
}
`;

const FS_BLUR = HEAD + `
uniform sampler2D tSrc; uniform vec2 uDir; uniform float uRadius;
void main(){
  if (uRadius < 0.25){ o = texture(tSrc, vUv); return; }
  vec4 sum = vec4(0.0); float wsum = 0.0;
  float st = uRadius/6.0;
  for (int i=-6;i<=6;i++){
    float x = float(i); float w = exp(-x*x/18.0);
    sum += texture(tSrc, vUv + uDir*x*st)*w; wsum += w;
  }
  o = sum/wsum;
}`;

const FS_DOWN = HEAD + `
uniform sampler2D tSrc; uniform vec2 uTexel;
void main(){
  vec2 h = uTexel*0.5;
  o = (texture(tSrc,vUv+vec2(-h.x,-h.y))+texture(tSrc,vUv+vec2(h.x,-h.y))+texture(tSrc,vUv+vec2(-h.x,h.y))+texture(tSrc,vUv+vec2(h.x,h.y)))*0.25;
}`;

const FS_COMBINE = HEAD + `
uniform sampler2D t0,t1,t2,t3; uniform vec4 uW; uniform float uGain;
void main(){
  float a = texture(t0,vUv).r*uW.x + texture(t1,vUv).r*uW.y + texture(t2,vUv).r*uW.z + texture(t3,vUv).r*uW.w;
  a *= uGain; o = vec4(a,a,a,1.0);
}`;

/* PASS A — fluid. Feedback buffer: advect own previous state, decay, re-inject the mask. */
const FS_FLUID = HEAD + NOISE + SWEEP + `
uniform sampler2D tPrev, tMask;
uniform vec2 uBrush; uniform float uBrushR, uSmear, uPersist, uWarp, uWarpScale, uDither, uMeltSrc, uDrip, uTime, uSeed, uStep;
uniform vec2 uDrag;
void main(){
  vec2 uv = vUv; vec2 P = vec2(uv.x*uAspect, uv.y);
  float tA = fbm(P*uWarpScale + uSeed + uTime*0.06);
  float tB = fbm(P*uWarpScale + vec2(6.7,2.3) + uSeed - uTime*0.05);
  vec2 turb = (vec2(tA,tB)-0.5)*uWarp;
  float d = length(P-uBrush);
  float infl = exp(-pow(d/max(uBrushR,0.001), 2.0));
  float mass = texture(tPrev, uv).r;
  float col = 0.35 + 1.3*hash11(floor(P.x*90.0) + uSeed*3.7);      // per-column rivulets
  float gate = mix(0.08, 1.0, uHide);                                 // drip harder once erasing starts
  vec2 drip = vec2(0.0,-1.0)*uDrip*col*(0.25+0.95*mass)*gate;
  vec2 flow = ((uDrag+turb)*uSmear*(0.22+infl*1.6) + drip) * 0.03 * uStep;
  vec2 src = clamp(uv - vec2(flow.x/uAspect, flow.y), 0.0, 1.0);
  float adv = texture(tPrev, src).r;
  float fresh = texture(tMask, uv).a * sweepMask(uv);
  float inj = fresh * mix(clamp(infl,0.0,1.0), 1.0, uMeltSrc);
  float p = pow(clamp(uPersist,0.0,1.0), max(uStep,1e-3));
  float r = min(adv*p + inj*(1.0-p)*3.0, 1.0);
  r += (hash21(gl_FragCoord.xy + uSeed*17.0)-0.5)*uDither*(1.0/255.0);
  o = vec4(r, r, r, 1.0);
}`;

/* PASS M — melt. r: displacement, g: velocity, b: mass, a: heat. Heat must cross the melt point
   before material yields; viscosity drags, tension smooths sideways, spread diffuses the field. */
const FS_MELT = HEAD + NOISE + `
uniform sampler2D tPrev, tFlow; uniform vec2 uTexel; uniform float uAspect, uDt, uSeed, uTime,
  uHeat, uHeatScale, uMeltPoint, uGravity, uVisc, uTension, uSpread, uReset;
void main(){
  if (uReset > 0.5){ o = vec4(0.0); return; }
  vec4 s = texture(tPrev, vUv);
  float mass = texture(tFlow, vUv).r;
  vec2 P = vec2(vUv.x*uAspect, vUv.y);
  float n = fbm(P*uHeatScale + vec2(uSeed*0.37, uTime*0.12));
  float n2 = fbm(P*uHeatScale*2.1 - vec2(uTime*0.07, uSeed));
  float src = pow(clamp(n*0.7+n2*0.5,0.0,1.0), 2.0) * 2.2 * uHeat;
  float heat = clamp(s.a + (src - 0.45*s.a)*uDt, 0.0, 4.0);
  float yieldF = smoothstep(uMeltPoint*0.85, uMeltPoint*1.15, heat) * smoothstep(0.03, 0.35, mass);
  vec2 dx = vec2(uTexel.x*max(1.0,uSpread*0.25), 0.0);
  vec2 dy = vec2(0.0, uTexel.y*max(1.0,uSpread*0.25));
  vec4 sl = texture(tPrev, vUv-dx), sr = texture(tPrev, vUv+dx), su = texture(tPrev, vUv+dy), sd = texture(tPrev, vUv-dy);
  float vel = s.g + (uGravity*yieldF - uVisc*s.g)*uDt;
  vel = mix(vel, (sl.g+sr.g)*0.5, clamp(uTension*uDt*30.0, 0.0, 0.9));
  float disp = s.r + vel*uDt;
  float avg = (sl.r+sr.r+su.r+sd.r)*0.25;
  disp = mix(disp, max(disp, avg), clamp(uSpread*0.004, 0.0, 0.6));
  disp -= disp*0.02*uDt;
  o = vec4(clamp(disp,0.0,1.0), clamp(vel,-2.0,2.0), mass, heat);
}`;

/* PASS core — what is "hot": the raw shape plus the fluid trail */
const FS_CORE = HEAD + SWEEP + `
uniform sampler2D tFluid, tMask; uniform float uMeltSrc, uSep;
void main(){
  float raw = texture(tMask, vUv).a * sweepMask(vUv);
  float fl = texture(tFluid, vUv).r;
  float c = mix(max(raw, fl), max(fl, raw*0.35), uMeltSrc);
  c = mix(c, smoothstep(0.10, 0.62, c), uSep);
  o = vec4(c, c, c, 1.0);
}`;

/* PASS C — thermal colour map: one monotone 7-stop ramp, RGB split outward from centre */
const FS_THERMAL = HEAD + SWEEP + `
uniform sampler2D tCore, tGlow, tMask;
uniform vec3 uGround, uSec, uPri, uBurn, uCore;
uniform float uSplit, uExposure, uFlat, uSep, uGlowAmt, uBlend;
vec3 ramp(float t){
  vec3 c0 = mix(vec3(0.0), uGround, uBlend);

  const out = {reveal:1, hide:0, hideRev:0, axis:D.axis, bias:D.bias, radial:D.radial, brush:[-10,-10], drag:[0,0], warpMul:1, brushR:P.brushRadius, reset:false};
  if (P.mode === 'manual'){
    out.axis = [0,0]; out.bias = 0; out.radial = 0;
    if (pointer.down){ out.brush = [pointer.x*ar, pointer.y]; const l = Math.hypot(pointer.vx, pointer.vy); const k = Math.min(1.5, l*6)/(l||1); out.drag = [pointer.vx*k, pointer.vy*k]; }
    return out;
  }
  const cyc = P.cycle; const u = (t % cyc)/cyc;
  if (P.loop === 'hold'){ out.reveal = ease(Math.min(1, t/(cyc*0.45)), P.easing); out.hide = 0; }
  else {
    out.reveal = ease(u/0.42, P.easing);
    out.hide = ease((u-0.56)/0.38, P.easing);
    if (P.loop === 'pingpong') out.hideRev = 1;
  }
  const front = out.hide > 0 ? out.hide : out.reveal;
  const frontC = P.loop==='pingpong' && out.hide>0 ? 1-front : front;
  // brush position per preset (poster space x*ar, y)
  const tt = t*(6/cyc);
  let bx = 0.5, by = 0.5; let dr = D.drag.slice();
  const perp = 0.5 + 0.34*Math.sin(tt*2.3) + 0.08*Math.sin(tt*5.1);
  const along = c => {
    if (D.radial){ const ang = tt*1.7; const rr = (D.radial===1 ? c : 1-c)*0.62; return [0.5+Math.cos(ang)*rr/ar*1.0, 0.5+Math.sin(ang)*rr]; }
    if (P.direction==='ttb') return [perp, 1-c]; if (P.direction==='btt') return [perp, c];
    if (P.direction==='ltr') return [c, perp]; return [1-c, perp];
  };
  if (P.preset === 'sweep'){ [bx,by] = along(frontC); if (P.loop==='pingpong' && out.hide>0) dr = [-dr[0],-dr[1]]; }
  else if (P.preset === 'drift'){
    bx = 0.5 + 0.32*Math.sin(tt*0.71 + P.seed) + 0.1*Math.sin(tt*1.9); by = 0.5 + 0.34*Math.cos(tt*0.53 + P.seed*0.3) + 0.08*Math.sin(tt*2.3);
    const a = tt*0.4 + P.seed; dr = [dr[0]*0.7 + Math.cos(a)*0.6, dr[1]*0.7 + Math.sin(a)*0.6];
  } else if (P.preset === 'orbit'){
    const a = u*Math.PI*4; bx = 0.5 + Math.cos(a)*0.3; by = 0.5 + Math.sin(a)*0.3*ar*0.8; dr = [-Math.sin(a), Math.cos(a)];
  } else if (P.preset === 'pulse'){
    const s = Math.sin(u*Math.PI*6); out.brushR = P.brushRadius*(1.2 + 0.9*s); dr = [0, -s];
  } else if (P.preset === 'boil'){
    const k = Math.floor(t/0.18); bx = 0.1 + 0.8*hashN(k); by = 0.1 + 0.8*hashN(k+91.7); const a = hashN(k+3.3)*6.283; dr = [Math.cos(a), Math.sin(a)]; out.warpMul = 1.8;
  }
  if (D.radial && P.preset!=='orbit' && P.preset!=='boil' && P.preset!=='drift'){ const dx = bx-0.5, dy = by-0.5; const l = Math.hypot(dx,dy)||1; dr = D.radial===1 ? [dx/l,dy/l] : [-dx/l,-dy/l]; if (P.preset==='pulse'){ bx = 0.5; by = 0.5; } }
  out.brush = [bx*ar, by];
  out.drag = dr;
  if (pointer.down){ out.brush = [pointer.x*ar, pointer.y]; const l = Math.hypot(pointer.vx, pointer.vy); if (l>0.0005){ const k = Math.min(1.5,l*6)/l; out.drag = [pointer.vx*k, pointer.vy*k]; } }
  return out;
}
function sweepUniforms(A){
  return {uReveal:A.reveal, uHide:A.hide, uSoft:P.sweepSoft, uHideRev:A.hideRev, uRadial:A.radial, uAxis:A.axis, uBias:A.bias, uAspect:aspectRatio()};
}

/* simulation step: fluid + melt (ping-pong) */
function stepSim(t, dt, A){
  const step = Math.min(3, Math.max(0.2, dt*60));
  const su = sweepUniforms(A);
  draw(PR.fluid, RT.fluidB, Object.assign({}, su, {
    uBrush:A.brush, uBrushR:A.brushR, uSmear:P.smear, uPersist:P.persistence, uWarp:P.warp*A.warpMul, uWarpScale:P.warpScale,
    uDither:FMT.half?0:1, uMeltSrc:P.meltSource?1:0, uDrip:P.drip?P.dripAmount:0, uTime:t, uSeed:P.seed%1000, uStep:step, uDrag:A.drag,
  }), {tPrev:RT.fluidA.tex, tMask:RT.mask.tex});
  [RT.fluidA, RT.fluidB] = [RT.fluidB, RT.fluidA];
  const mdt = Math.min(0.05, dt)*P.meltSpeed;
  draw(PR.melt, RT.meltB, {
    uTexel:[1/SW,1/SH], uAspect:aspectRatio(), uDt:mdt, uSeed:P.seed%1000, uTime:t*P.meltSpeed,
    uHeat:P.meltHeat, uHeatScale:P.meltScale, uMeltPoint:P.meltPoint, uGravity:P.meltGravity, uVisc:P.meltVisc,
    uTension:P.meltTension, uSpread:P.meltSpread, uReset:A.reset?1:0,
  }, {tPrev:RT.meltA.tex, tFlow:RT.fluidA.tex});
  [RT.meltA, RT.meltB] = [RT.meltB, RT.meltA];
}
function resetSim(){ [RT.fluidA, RT.fluidB, RT.meltA, RT.meltB].forEach(clearRT); }

/* ─── 9. Render (core → glow → thermal → post) ───────────────────── */
let lensLow = false;
function glowPass(){
  const s = P.glowSoft/40;
  let prev = RT.core;
  RT.lv.forEach((l, i) => {
    draw(PR.down, l.a, {uTexel:[1/prev.w, 1/prev.h]}, {tSrc:prev.tex});
    const r = 1.5 + P.glowSoft*0.22;
    draw(PR.blur, l.b, {uDir:[1/l.a.w,0], uRadius:r}, {tSrc:l.a.tex});
    draw(PR.blur, l.a, {uDir:[0,1/l.a.h], uRadius:r}, {tSrc:l.b.tex});
    prev = l.a;
  });
  const k = 0.35 + s*1.3; const w = [1, k, k*k, k*k*k]; const sum = w.reduce((a,b)=>a+b,0);
  draw(PR.combine, RT.glow, {uW:w.map(x=>x/sum), uGain:2.1}, {t0:RT.lv[0].a.tex, t1:RT.lv[1].a.tex, t2:RT.lv[2].a.tex, t3:RT.lv[3].a.tex});
}
function compose(A, t, maskRT, coreRT, sceneRT, textTex, outRT, alphaOut, outW, outH){
  const su = sweepUniforms(A);
  draw(PR.core, coreRT, Object.assign({}, su, {uMeltSrc:P.meltSource?1:0, uSep:P.separate?1:0}), {tFluid:RT.fluidA.tex, tMask:maskRT.tex});
  if (coreRT === RT.core) glowPass();
  draw(PR.thermal, sceneRT, Object.assign({}, su, {
    uGround:hex3(P.ground), uSec:hex3(P.secondary), uPri:hex3(P.primary), uBurn:hex3(P.burn), uCore:hex3(P.core),
    uSplit:P.rgbSplit, uExposure:P.exposure, uFlat:P.burnOn?0:1, uSep:P.separate?1:0, uGlowAmt:P.glowAmt, uBlend:P.blend==='normal'?1:0,
  }), {tCore:coreRT.tex, tGlow:RT.glow.tex, tMask:maskRT.tex});
  const taps = P.lensQuality==='high' ? 48 : P.lensQuality==='low' ? 16 : (lensLow ? 16 : 40);
  draw(PR.post, outRT, {
    uRes:[outW, outH], uGround:hex3(P.ground), uAspect:aspectRatio(), uTime:t, uSeed:P.seed%100, uPostOn:P.postOn?1:0,
    uMelt:P.melt, uMeltType:P.meltType, uTextOn:P.metaOn?1:0, uMode:+P.textMode, uAlphaOut:alphaOut?1:0,
    uLens:P.lensBlur, uFocus:P.lensFocus, uRange:P.lensRange, uHi:P.lensHi, uDistort:P.lensDistort, uEdge:P.lensEdge,
    uFull:P.lensMode==='full'?1:0, uTaps:outRT ? 48 : taps, uFringe:P.lensFringe, uGrain:P.grain, uGrainSize:P.grainSize, uThresh:P.thresh, uContrast:P.contrast,
  }, {tScene:sceneRT.tex, tText:P.metaOn ? textTex : texEmpty, tMelt:RT.meltA.tex});
}

/* frame-time watchdog for adaptive lens quality */
let ftAvg = 16, warm = 60;
function loop(now){
  requestAnimationFrame(loop);
  if (layout()){ maskDirty = true; metaDirty = true; }
  if (maskDirty){ drawMaskCanvas(mc, mctx, W, H); uploadMask(mc, RT.maskTmp, RT.mask, W/1000); maskDirty = false; }
  if (metaDirty){ drawMeta(tc, tctx, W, H); uploadMeta(tc, texText); metaDirty = false; }
  let dt = lastNow ? (now-lastNow)/1000 : 1/60; lastNow = now; dt = Math.min(dt, 0.1);
  if (warm > 0) warm--; else { ftAvg = ftAvg*0.95 + dt*1000*0.05; if (!lensLow && ftAvg > 24) lensLow = true; if (lensLow && ftAvg < 14) lensLow = false; }
  if (needReset){ resetSim(); needReset = false; }
  pointer.vx *= 0.85; pointer.vy *= 0.85;
  const prevT = simTime;
  if (playing || pointer.down || P.mode==='manual'){
    if (playing) simTime += dt;
    const A = anim(simTime);
    if (P.mode==='auto' && P.loop!=='hold' && Math.floor(simTime/P.cycle) !== Math.floor(prevT/P.cycle)) A.reset = true;
    stepSim(simTime, dt, A);
  }
  const A = anim(simTime);
  compose(A, simTime, RT.mask, RT.core, RT.scene, texText, null, false, W, H);
  updateHud();
  if (recState.loopEnd && simTime >= recState.loopEnd) stopRec();
}

/* scrub: re-simulate from the cycle start to the target time */
function settleTo(target){
  resetSim();
  const base = Math.floor(simTime/P.cycle)*P.cycle;
  const steps = Math.min(240, Math.max(1, Math.ceil((target)*30)));
  const dt = target/steps;
  for (let i=1;i<=steps;i++){ const t = base + i*dt; const A = anim(t); stepSim(t, dt, A); }
  simTime = base + target;
}

/* ─── 10. HUD / timeline ─────────────────────────────────────────── */
const tl = $('#tl');
let scrubbing = false;
function updateHud(){
  const u = P.mode==='auto' ? (P.loop==='hold' ? Math.min(1, simTime/P.cycle) : (simTime%P.cycle)/P.cycle) : 0;
  if (!scrubbing) tl.value = Math.round(u*1000);
  $('#time').textContent = P.mode==='auto' ? `${(u*P.cycle).toFixed(1)} / ${P.cycle.toFixed(1)}s` : (LANG==='zh'?'手動':'manual');
  $('#hud').textContent = `${W}×${H} · SIM ${SW}×${SH} · ${FMT.half?'16F':'8BIT'}${lensLow?' · LENS 16':''} · ${Math.round(1000/ftAvg)} FPS`;
}
tl.addEventListener('input', ()=>{ scrubbing = true; playing = false; syncPlay(); settleTo(tl.value/1000*P.cycle); });
tl.addEventListener('change', ()=>{ scrubbing = false; });

/* ─── 11. Export ─────────────────────────────────────────────────── */
function stamp(){ const d = new Date(); const p = n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
/* on claude.ai the page has to hand files over through the downloads capability; the local file uses a plain link */
let dlNS = null;
const dlReady = (window.claude && window.claude.use) ? Promise.resolve(window.claude.use('downloads')).then(n=>{ dlNS = n; }).catch(()=>{}) : Promise.resolve();
async function downloadBlob(blob, name){
  await dlReady;
  if (dlNS){
    try { await dlNS.save({filename:name, data:blob}); }
    catch(e){ if (e && e.code !== 'declined') toast((LANG==='zh'?'無法存檔：':'Save failed: ') + (e.code||'')); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function exportPNG(alpha){
  const ar = aspectRatio(); const L = +P.exportH;
  let ew = ar >= 1 ? L : Math.round(L*ar), eh = ar >= 1 ? Math.round(L/ar) : L;
  const maxT = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  if (Math.max(ew,eh) > maxT){ const k = maxT/Math.max(ew,eh); ew = Math.floor(ew*k); eh = Math.floor(eh*k); }
  const tmp = makeRT(FMT8), mask = makeRT(FMT8), core = makeRT(), scene = makeRT(), out = makeRT(FMT8);
  [tmp, mask, core, scene, out].forEach(rt=>sizeRT(rt, ew, eh));
  const c = document.createElement('canvas'), cx = c.getContext('2d', {willReadFrequently:true});
  drawMaskCanvas(c, cx, ew, eh); uploadMask(c, tmp, mask, ew/1000);
  const ttex = makeTex(); const c2 = document.createElement('canvas'); drawMeta(c2, c2.getContext('2d'), ew, eh); uploadMeta(c2, ttex);
  compose(anim(simTime), simTime, mask, core, scene, ttex, out, alpha, ew, eh);
  const px = new Uint8Array(ew*eh*4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, out.fbo); gl.readPixels(0,0,ew,eh,gl.RGBA,gl.UNSIGNED_BYTE,px);
  [tmp,mask,core,scene,out].forEach(freeRT); gl.deleteTexture(ttex);
  maskDirty = true;
  const oc = document.createElement('canvas'); oc.width = ew; oc.height = eh; const octx = oc.getContext('2d');
  const id = octx.createImageData(ew, eh); const row = ew*4;
  for (let y=0;y<eh;y++) id.data.set(px.subarray((eh-1-y)*row, (eh-y)*row), y*row);
  octx.putImageData(id, 0, 0);
  oc.toBlob(b=>{ downloadBlob(b, `zhuo-zi_${stamp()}${alpha?'_alpha':''}.png`); toast(`${tr('saved')} · ${ew}×${eh}`); }, 'image/png');
}
const recState = {rec:null, chunks:[], loopEnd:0};
function pickMime(){
  const c = ['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm'];
  return c.find(m=>window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
}
function startRec(loopOnly){
  if (!window.MediaRecorder || !cv.captureStream){ toast(tr('noRec')); return; }
  if (recState.rec) return;
  if (loopOnly){ simTime = 0; needReset = true; playing = true; syncPlay(); recState.loopEnd = P.cycle - 1/60; } else recState.loopEnd = 0;
  const mime = pickMime();
  const stream = cv.captureStream(60);
  const rec = new MediaRecorder(stream, mime ? {mimeType:mime, videoBitsPerSecond:16e6} : {videoBitsPerSecond:16e6});
  recState.chunks = [];
  rec.ondataavailable = e => { if (e.data.size) recState.chunks.push(e.data); };
  rec.onstop = () => { const type = rec.mimeType || mime || 'video/webm'; const ext = type.includes('mp4') ? 'mp4' : 'webm';
    downloadBlob(new Blob(recState.chunks, {type}), `zhuo-zi_${stamp()}.${ext}`); toast(tr('saved')); };
  rec.start(250); recState.rec = rec;
  $('#rec').style.display = 'block'; $('#bRec').textContent = tr('recStop'); $('#bRec').classList.add('hot');
}
function stopRec(){
  if (!recState.rec) return;
  recState.rec.stop(); recState.rec = null; recState.loopEnd = 0;
  $('#rec').style.display = 'none'; $('#bRec').textContent = tr('rec'); $('#bRec').classList.remove('hot');
}
function saveJSON(){ downloadBlob(new Blob([JSON.stringify(P, null, 2)], {type:'application/json'}), `zhuo-zi_settings_${stamp()}.json`); }

/* ─── 12. UI builder ─────────────────────────────────────────────── */
const lab = a => Array.isArray(a) ? a[LANG==='zh'?0:1] : a;
function fmtVal(it, v){ if (it.f==='x') return (+v).toFixed(2)+'×'; if (it.f==='s') return (+v).toFixed(1)+'s';
  const st = it.step||0.01; const d = st>=1 ? 0 : st>=0.1 ? 1 : st>=0.01 ? 2 : st>=0.001 ? 3 : 4; return (+v).toFixed(d); }
function onChange(it){
  if (it.mask) { maskDirty = true; ensureFonts(); }
  if (it.meta) { metaDirty = true; ensureFonts(); }
  if (it.resize) { W = 0; needReset = true; }

}

function el(tag, cls){ const e = document.createElement(tag); if (cls) e.className = cls; return e; }

/* static strings & tooltips */
function d_i18n(){
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent = tr(e.dataset.i18n));
  $('#bLang').textContent = LANG==='zh' ? 'EN' : '中';
  $('#bTips').textContent = tr('tips'); $('#bReset').textContent = tr('reset');
  $('#bRecLoop').textContent = tr('recLoop'); if (!recState.rec) $('#bRec').textContent = tr('rec');
  $('#view').dataset.drop = tr('drop');
  document.documentElement.lang = LANG==='zh' ? 'zh-Hant' : 'en';
}
const tipEl = $('#tip');
document.addEventListener('mouseover', e=>{
  if (!TIPS) return; const t = e.target.closest('[data-tip]'); if (!t){ tipEl.style.display='none'; return; }
  let s = t.dataset.tip; s = s.startsWith('[') ? JSON.parse(s)[LANG==='zh'?0:1] : tr(s);
  tipEl.textContent = s; tipEl.style.display = 'block';
});
document.addEventListener('mousemove', e=>{ if (tipEl.style.display==='block'){ const x = Math.min(window.innerWidth-250, e.clientX+14); tipEl.style.left = x+'px'; tipEl.style.top = (e.clientY+16)+'px'; } });
document.addEventListener('mouseout', e=>{ if (!e.relatedTarget) tipEl.style.display='none'; });
let toastT = 0;
function toast(s){ const t = $('#toast'); t.textContent = s; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(()=>t.style.display='none', 1800); }

/* persistence */
let persistT = 0;
function persist(){ clearTimeout(persistT); persistT = setTimeout(()=>{ try{ localStorage.setItem(STORE_KEY, JSON.stringify({P, LANG, TIPS, ui:document.documentElement.dataset.ui||'dark'})); }catch(e){} }, 250); }
function restore(){
  try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)||'null'); if (!s) return;
    if (s.P) P = Object.assign(JSON.parse(JSON.stringify(DEF)), s.P);
    if (s.LANG) LANG = s.LANG; if (typeof s.TIPS==='boolean') TIPS = s.TIPS;
    if (s.ui) document.documentElement.dataset.ui = s.ui;
  }catch(e){}
  if (P.contentType !== 'text') P.contentType = 'text';      // images are not stored between visits
  if (!FONTS[P.font]) P.font = 'noto-sans'; if (!FONTS[P.metaFont]) P.metaFont = 'noto-sans';
}

/* ─── 13. Inputs: buttons, files, pointer, keys ──────────────────── */
function syncPlay(){ $('#bPlay').textContent = playing ? '❚❚' : '▶'; }
$('#bPlay').onclick = ()=>{ playing = !playing; syncPlay(); };
$('#bRestart').onclick = ()=>{ simTime = 0; needReset = true; playing = true; syncPlay(); };
$('#bPng').onclick = ()=>exportPNG(false);
$('#bRec').onclick = ()=> recState.rec ? stopRec() : startRec(false);
$('#bRecLoop').onclick = ()=> { if (P.mode!=='auto'){ P.mode='auto'; buildUI(); } startRec(true); };
$('#bLang').onclick = ()=>{ LANG = LANG==='zh' ? 'en' : 'zh'; buildUI(); maskDirty = true; persist(); };
$('#bTips').onclick = ()=>{ TIPS = !TIPS; $('#bTips').classList.toggle('on', TIPS); tipEl.style.display='none'; persist(); };
$('#bTheme').onclick = ()=>{ const r = document.documentElement; r.dataset.ui = r.dataset.ui==='light' ? 'dark' : 'light'; persist(); };
let resetArm = 0;
$('#bReset').onclick = ()=>{
  if (Date.now() - resetArm > 2500){ resetArm = Date.now(); toast(LANG==='zh'?'再按一次確定重設':'Click again to reset'); return; }
  P = JSON.parse(JSON.stringify(DEF)); asset = null; needReset = true; maskDirty = metaDirty = true; W = 0; ensureFonts(); buildUI(); persist(); toast(tr('resetDone'));
};

function loadAssetFile(file){
  const isSvg = /svg/.test(file.type) || /\.svg$/i.test(file.name);
  const url = URL.createObjectURL(file); const img = new Image();
  img.onload = ()=>{ asset = {img, kind:isSvg?'svg':'image'}; P.contentType = isSvg ? 'svg' : 'image'; if (isSvg) P.imgMode = 'alpha';
    else P.imgMode = /png|webp|gif/.test(file.type) ? P.imgMode : (P.imgMode==='alpha'?'dark':P.imgMode);
    maskDirty = true; needReset = true; buildUI(); };
  img.onerror = ()=>toast(LANG==='zh'?'無法讀取這個檔案':'Could not read that file');
  img.src = url;
}
async function loadFontFile(file){
  try{
    const buf = await file.arrayBuffer(); const name = file.name.replace(/\.[^.]+$/,'').slice(0,40);
    const face = new FontFace('U_'+name, buf); await face.load(); document.fonts.add(face);
    customFonts[name] = 'U_'+name; P.font = name; P.contentType = 'text'; maskDirty = true; buildUI(); toast(tr('fontLoaded')+name);
  }catch(e){ toast(LANG==='zh'?'字型載入失敗':'Font failed to load'); }
}
function handleFile(f){ if (!f) return; if (/\.(ttf|otf|woff2?)$/i.test(f.name)) loadFontFile(f); else if (/\.json$/i.test(f.name)) loadJSON(f); else if (/^image\//.test(f.type) || /\.svg$/i.test(f.name)) loadAssetFile(f); }
function loadJSON(f){ f.text().then(t=>{ try{ const o = JSON.parse(t); P = Object.assign(JSON.parse(JSON.stringify(DEF)), o); if (!FONTS[P.font] && !customFonts[P.font]) P.font='noto-sans'; if (P.contentType!=='text' && !asset) P.contentType='text';
  W = 0; needReset = true; maskDirty = metaDirty = true; ensureFonts(); buildUI(); persist(); toast(tr('loaded')); }catch(e){ toast('JSON ✕'); } }); }
$('#fImg').onchange = e=>{ handleFile(e.target.files[0]); e.target.value=''; };
$('#fFont').onchange = e=>{ handleFile(e.target.files[0]); e.target.value=''; };
$('#fJson').onchange = e=>{ handleFile(e.target.files[0]); e.target.value=''; };
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev, e=>{ e.preventDefault(); document.body.classList.add('drop'); }));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev, e=>{ e.preventDefault(); if (ev==='drop' || !e.relatedTarget) document.body.classList.remove('drop'); }));
document.addEventListener('drop', e=>{ handleFile(e.dataTransfer.files[0]); });
document.addEventListener('paste', e=>{ const it = [...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/')); if (it) handleFile(it.getAsFile()); });

function toUV(e){ const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width, 1-(e.clientY-r.top)/r.height]; }
cv.addEventListener('pointerdown', e=>{ cv.setPointerCapture(e.pointerId); const [x,y] = toUV(e); Object.assign(pointer, {down:true, x, y, px:x, py:y, vx:0, vy:0}); });
cv.addEventListener('pointermove', e=>{ if (!pointer.down) return; const [x,y] = toUV(e);
  pointer.vx = pointer.vx*0.5 + (x-pointer.x)*0.5; pointer.vy = pointer.vy*0.5 + (y-pointer.y)*0.5; pointer.x = x; pointer.y = y; });
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev, ()=>{ pointer.down = false; }));

document.addEventListener('keydown', e=>{
  if (e.target.matches('input[type=text],textarea,select')) return;
  if (e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k===' '){ e.preventDefault(); playing = !playing; syncPlay(); }
  else if (k==='r'){ simTime = 0; needReset = true; }
  else if (k==='n'){ newSeed(); }
  else if (k==='s'){ exportPNG(false); }
  else if (k==='v'){ recState.rec ? stopRec() : startRec(false); }
  else if (k==='h'){ document.body.classList.toggle('nopanel'); W = 0; }
});
window.addEventListener('resize', ()=>{ /* layout() runs each frame */ });

/* ─── 14. Boot ───────────────────────────────────────────────────── */
restore();
$('#bTips').classList.toggle('on', TIPS);
buildUI(); syncPlay(); ensureFonts();
/* open on a legible frame instead of an empty one: once fonts are in, pre-run the sim to just after the reveal */
let booted = false;
function bootSettle(){ if (booted) return; booted = true; drawMaskCanvas(mc, mctx, W, H); uploadMask(mc, RT.maskTmp, RT.mask, W/1000); maskDirty = false; if (P.mode==='auto' && simTime < 1.5) settleTo(P.cycle*0.47); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ maskDirty = true; metaDirty = true; requestAnimationFrame(bootSettle); });
setTimeout(()=>requestAnimationFrame(bootSettle), 2500);
requestAnimationFrame(loop);
</script>
