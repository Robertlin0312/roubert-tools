<style>
/* Layout: hairline tool panel on the left, two paper sheets (output / drawing pad) on the right; stacks on phones. Single light theme by choice: the work is ink on paper. */
:root{
  --paper:#ffffff;
  --ground:#f2f2ef;
  --ink:#111111;
  --mute:#85857f;
  --line:#d4d4cf;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --sans:"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:13px/1.45 var(--sans)}
*{box-sizing:border-box}
.app{
  display:grid;grid-template-columns:288px minmax(0,1fr);gap:16px;
  min-height:100%;
  padding-block:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.panel{
  background:var(--paper);border:1px solid var(--ink);
  align-self:start;position:sticky;top:16px;
  max-height:calc(100vh - 32px);overflow-y:auto;
  display:flex;flex-direction:column;
}
.head{padding:14px 14px 12px;border-bottom:1px solid var(--ink);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font:500 16px var(--sans);letter-spacing:.12em}
.brand span{font:500 11px var(--mono);letter-spacing:.14em;color:var(--mute)}
.hint{font:11px/1.5 var(--mono);color:var(--mute)}
.bar{display:grid;grid-template-columns:1.2fr 1fr 1fr;border-bottom:1px solid var(--ink)}
.bar > *{border-right:1px solid var(--ink)}
.bar > *:last-child{border-right:0}
.sec{border-bottom:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sec:last-child{border-bottom:0}
.sec h3{margin:0;font:500 13px var(--sans);letter-spacing:.08em;display:flex;justify-content:space-between;align-items:baseline}
.sec h3 em{font:400 10px var(--mono);font-style:normal;color:var(--mute);letter-spacing:.12em;text-transform:uppercase}
.row{display:grid;grid-template-columns:74px minmax(0,1fr) 36px;align-items:center;gap:8px}
.row label{font-size:12px;white-space:nowrap}
.row output{font:11px var(--mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
.row.sel{grid-template-columns:74px minmax(0,1fr)}
.row label{overflow:hidden;text-overflow:ellipsis}
.btn{
  appearance:none;border:1px solid var(--ink);background:var(--paper);color:var(--ink);
  font:500 12px var(--mono);padding:7px 10px;cursor:pointer;border-radius:0;
}
.bar .btn{border:0;padding:9px 6px;font-family:var(--sans)}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.big{font-size:14px;padding:9px 14px;align-self:flex-start}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.seed{font:11px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
select{
  appearance:none;-webkit-appearance:none;width:100%;
  border:1px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);
  font:12px var(--sans);padding:4px 22px 4px 7px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 11px) 50%,calc(100% - 7px) 50%;background-size:4px 4px;background-repeat:no-repeat;
}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;background:var(--ink);border:0;margin-top:-4.5px;border-radius:0}
input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;background:var(--ink);border:0;border-radius:0}
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:12px}
.chk small{font:11px var(--mono);color:var(--mute)}
.chk input{appearance:none;-webkit-appearance:none;width:13px;height:13px;border:1px solid var(--ink);border-radius:50%;margin:0;display:grid;place-content:center;cursor:pointer;background:var(--paper);flex:none}
.chk input:checked{background:var(--ink);box-shadow:inset 0 0 0 2px var(--paper)}
.bar .chk{justify-content:center;font:500 12px var(--sans);padding:9px 6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.exp{display:grid;grid-template-columns:44px 1fr 1fr;gap:6px;align-items:center}
.exp span{font-size:12px}
.exp .btn{padding:6px 8px}
.sec.off .row,.sec.off .chk:not(.master){opacity:.38;pointer-events:none}
.chk.master{font-weight:500}
.tools{display:flex;flex-wrap:nowrap;gap:8px;align-items:center;height:34px;min-width:0}
.tools .ctl input[type=range]{min-width:40px}
.tools .ctl label{overflow:hidden;text-overflow:ellipsis}
.tools .note{margin-left:auto;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tools .seg{flex:none}
.tools .seg button{font:500 12px var(--sans);padding:5px 10px;white-space:nowrap}
.tools > .btn{flex:none}
.tools .ctl{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0}
.tools .ctl label{font-size:12px;white-space:nowrap}
.tools .ctl output{font:11px var(--mono);color:var(--mute);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.tools .btn{padding:5px 9px;white-space:nowrap}
.tools .btn:disabled{opacity:.35;cursor:default;background:var(--paper);color:var(--ink)}
.lyr{display:flex;flex-direction:column;border:1px solid var(--ink)}
.lrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:6px;padding:5px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow.act{background:var(--ink);color:var(--paper)}
.lrow .eye{appearance:none;border:1px solid currentColor;background:transparent;color:inherit;width:16px;height:16px;border-radius:50%;cursor:pointer;padding:0;display:grid;place-content:center}
.lrow .eye::after{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.lrow .eye[aria-pressed="false"]::after{background:transparent}
.lrow .nm{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .nm small{font:10px var(--mono);opacity:.6;margin-left:6px}
.lrow input.nm{font:12px var(--sans);border:1px solid var(--line);padding:1px 4px;width:100%;color:var(--ink);background:var(--paper)}
.lrow .ops{display:flex;gap:2px}
.lrow .ops button{appearance:none;border:0;background:transparent;color:inherit;font:12px var(--mono);width:20px;height:20px;cursor:pointer;padding:0}
.lrow .ops button:hover{outline:1px solid currentColor}
.lrow.hid .nm{opacity:.45}
.topbar{display:flex;gap:6px;align-items:center;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{appearance:none;border:0;background:var(--paper);color:var(--ink);font:500 11px var(--mono);padding:3px 8px;cursor:pointer;border-radius:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.tipbtn{appearance:none;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font:500 11px var(--sans);padding:3px 8px;cursor:pointer;border-radius:0;display:inline-flex;gap:6px;align-items:center}
.tipbtn i{width:7px;height:7px;border:1px solid var(--ink);border-radius:50%;display:inline-block}
.tipbtn[aria-pressed="true"] i{background:var(--ink)}
.tip{position:fixed;z-index:20;max-width:240px;background:var(--paper);color:var(--ink);border:1px solid var(--ink);
  padding:7px 9px;font:12px/1.5 var(--sans);pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:3px 3px 0 var(--ink)}
.tip.on{opacity:1}
.tip b{display:block;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.grp{background:var(--ink);color:var(--paper);padding:9px 14px 8px;display:flex;flex-direction:column;gap:2px}
.grp-t{font:500 13px var(--sans);letter-spacing:.08em;display:flex;justify-content:space-between;align-items:baseline}
.grp-t small{font:400 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.grp-n{font-size:11px;opacity:.7}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:block;border:1px solid var(--line);padding:2px 7px;font-size:11px;color:var(--mute)}
.chip input:checked + span{border-color:var(--ink);color:var(--ink)}
.chip input:focus-visible + span{outline:2px solid var(--ink);outline-offset:1px}

.stage{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:start;min-width:0}
.sheet{display:flex;flex-direction:column;gap:8px;width:min(100%, calc((100vh - 124px) * var(--ar, 1)));justify-self:center;min-width:0}
.cap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:500 13px var(--sans);letter-spacing:.08em}
.cap span{font:400 11px var(--sans);letter-spacing:0;color:var(--mute)}
.cap small{font:400 10px var(--mono);letter-spacing:.12em;color:var(--mute);margin-left:6px}
canvas{display:block;width:100%;height:auto;background:var(--paper);border:1px solid var(--ink)}
#pad{touch-action:none;cursor:none}
#out{cursor:crosshair}
.drop{outline:2px dashed var(--ink);outline-offset:4px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  background:var(--ink);color:var(--paper);font:12px var(--mono);padding:8px 12px;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)
}
.toast.on{opacity:1}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .panel{position:static;max-height:none;order:2}
  .stage{order:1}
  .sheet{width:100%}
}
@media (prefers-reduced-motion:reduce){.toast,.tip{transition:none}}
</style>

<script>
(() => {
const $ = s => document.querySelector(s);
const out = $('#out'), pad = $('#pad');
const pctx = pad.getContext('2d');
const INK = '#111111', PAPER = '#ffffff', DOT = '#c4c4bf', GUIDE = '#b9b9b3';
const STORE = 'isolate-v1';
const TAU = Math.PI * 2;

const RATIOS = { '1:1':[1,1], '4:5':[4,5], '3:2':[3,2], '16:9':[16,9], '9:16':[9,16] };
const RZ_GROUPS = [['stroke','線條','Stroke'],['sym','對稱','Mirror'],['fluid','流體','Fluid'],['iso','隔離','Grid'],['frag','碎片','Shards']];

const DEF = {
  seed: 2026,
  width: 44, wVar: 0, outline: 2, edge: 'scallop', rough: 0.3, freq: 0.5, smooth: 2, blend: 'layer',
  symOn: false, sym: 'kaleido', symMode: 'geo', symN: 6, symRot: 0, cx: 0.5, cy: 0.5,
  fluidOn: false, fluidMode: 'flow', fluid: 0.4, fluidScale: 0.35,
  iso: false, split: 'recursive', cols: 4, rows: 4, amount: 0.35, cellLine: false,
  fragOn: false, fragMode: 'shatter', frag: 0.4, fragCount: 18, fragAngle: 0, fragLine: false,
  showGrid: false, showDraw: true, showImage: true, canvasBg: true, showRef: true,
  ratio: '1:1', imgMode: 'edges', imgThresh: 0.35,
  rz: { stroke:true, sym:true, fluid:true, iso:true, frag:true }
};
let P = clone(DEF);
let strokes = [];
let layers = [], activeLayer = 0, nextId = 1, layerSeq = 1;
let tool = 'brush', brushW = 1, eraseR = 26, selected = null;
const hist = [];
function newLayer(name){ const id=nextId++; return { id, name: name||null, visible:true, w:1 }; }
let cur = null;
let pointer = null;
let img = null, imgProc = null;

function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ---------- utils ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hash(seed, i, p){ return ((seed*73856093) ^ ((i+1)*19349663) ^ (p*83492791)) >>> 0; }
const R = (i, p) => mulberry32(hash(P.seed, i, p));
function vnoise(rng){ const t=[]; for(let i=0;i<64;i++) t.push(rng()*2-1);
  return x => { const i=Math.floor(x), f=x-i, u=f*f*(3-2*f); const a=t[((i%64)+64)%64], b=t[(((i+1)%64)+64)%64]; return a+(b-a)*u; }; }
function noise2(seed){
  const rng=mulberry32(seed), g=new Float32Array(256), pm=new Uint8Array(256);
  for(let i=0;i<256;i++){ g[i]=rng()*2-1; pm[i]=i; }
  for(let i=255;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=pm[i]; pm[i]=pm[j]; pm[j]=t; }
  const v=(i,j)=>g[pm[(pm[i&255]+j)&255]];
  return (x,y)=>{ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi, u=xf*xf*(3-2*xf), w=yf*yf*(3-2*yf);
    const a=v(xi,yi), b=v(xi+1,yi), c=v(xi,yi+1), d=v(xi+1,yi+1); return a+(b-a)*u+(c-a)*w+(a-b-c+d)*u*w; };
}
function dims(base){ const [a,b] = RATIOS[P.ratio] || [1,1]; return a>=b ? [base, Math.round(base*b/a)] : [Math.round(base*a/b), base]; }

function chaikin(p){ if(p.length<3) return p; const o=[p[0]];
  for(let i=0;i<p.length-1;i++){ const a=p[i], b=p[i+1];
    o.push([a[0]*.75+b[0]*.25, a[1]*.75+b[1]*.25], [a[0]*.25+b[0]*.75, a[1]*.25+b[1]*.75]); }
  o.push(p[p.length-1]); return o; }
function resample(p, d){ if(p.length<2) return p.map(q=>q.slice());
  const o=[p[0].slice()]; let a=p[0], acc=0;
  for(let i=1;i<p.length;i++){ const b=p[i]; let seg=Math.hypot(b[0]-a[0], b[1]-a[1]);
    while(acc+seg>=d && seg>0){ const t=(d-acc)/seg; const q=[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]; o.push(q); a=q; seg=Math.hypot(b[0]-a[0], b[1]-a[1]); acc=0; }

    list.forEach(q=>c.strokeRect(q.x*W+.5,q.y*H+.5,q.w*W,q.h*H)); c.restore(); }
  if(usesCenter()){
    const cx=P.cx*W, cy=P.cy*H, B=Math.hypot(W,H), a0=P.symRot*Math.PI/180;
    c.save(); c.strokeStyle='#8f8f89'; c.lineWidth=1; c.setLineDash([2,4]); c.beginPath();
    const ray=a=>{ c.moveTo(cx,cy); c.lineTo(cx+Math.cos(a)*B, cy+Math.sin(a)*B); };
    if(!P.symOn){}
    else if(P.sym==='mirrorX'){ ray(a0+Math.PI/2); ray(a0-Math.PI/2); }
    else if(P.sym==='mirrorY'){ ray(a0); ray(a0+Math.PI); }
    else if(P.sym==='quad'){ for(let i=0;i<4;i++) ray(a0+i*Math.PI/2); }
    else if(P.sym==='radial' || P.sym==='kaleido'){ const N=symN(); for(let i=0;i<N;i++) ray(a0+i*TAU/N); }
    c.stroke(); c.setLineDash([]);
    c.beginPath(); c.arc(cx,cy,7,0,TAU); c.moveTo(cx-12,cy); c.lineTo(cx+12,cy); c.moveTo(cx,cy-12); c.lineTo(cx,cy+12); c.stroke();
    c.restore();
  }
  const its=items(W,H,k);
  its.forEach(it=>tubePass(c,it.p,it.w,0,INK));
  its.forEach(it=>tubePass(c,it.p,it.w,2*P.outline*k,PAPER));
  const sel=its.find(it=>it.s===selected);
  if(sel){ c.save(); c.strokeStyle=INK; c.lineWidth=1.5; c.setLineDash([6,5]); c.beginPath();
    sel.p.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1])); c.stroke();
    c.setLineDash([]); [sel.p[0], sel.p[sel.p.length-1]].forEach(q=>{ c.fillStyle=INK; c.fillRect(q[0]-4,q[1]-4,8,8); }); c.restore(); }
  if(pointer){ const x=pointer[0]*W, y=pointer[1]*H;
    c.save(); c.strokeStyle=INK; c.lineWidth=1;
    if(tool==='erase'){ const r=eraseR*k; c.setLineDash([4,3]); c.beginPath(); c.arc(x,y,r,0,TAU); c.stroke(); c.setLineDash([]);
      c.beginPath(); c.moveTo(x-4,y); c.lineTo(x+4,y); c.moveTo(x,y-4); c.lineTo(x,y+4); c.stroke(); }
    else if(tool==='select'){ c.beginPath(); c.moveTo(x-9,y); c.lineTo(x+9,y); c.moveTo(x,y-9); c.lineTo(x,y+9); c.stroke(); c.strokeRect(x-3.5,y-3.5,7,7); }
    else { const L=layers.find(l=>l.id===activeLayer), r=P.width*k*brushW*(L?L.w:1)/2;
      c.beginPath(); c.arc(x,y,Math.max(3,r),0,TAU); c.stroke();
      c.setLineDash([3,4]); c.beginPath(); c.arc(x,y,Math.max(3,r)+8*k,0,TAU); c.stroke();
      c.setLineDash([]); c.beginPath(); c.arc(x,y,2.5,0,TAU); c.fillStyle=INK; c.fill(); }
    c.restore(); }
}
let queued=false;
function req(){ if(queued) return; queued=true; requestAnimationFrame(()=>{ queued=false; renderTo(out, out.width, out.height); renderPad(); }); }

function resize(){
  const [ow,oh]=dims(1200), [pw,ph]=dims(1000);
  if(out.width!==ow||out.height!==oh){ out.width=ow; out.height=oh; }
  if(pad.width!==pw||pad.height!==ph){ pad.width=pw; pad.height=ph; }
  document.documentElement.style.setProperty('--ar', (ow/oh).toFixed(4));
}

/* ---------- image ---------- */
function processImage(){
  if(!img){ imgProc=null; return; }
  const m=900, sc=Math.min(1, m/Math.max(img.width,img.height));
  const w=Math.max(2,Math.round(img.width*sc)), h=Math.max(2,Math.round(img.height*sc));
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
  x.drawImage(img,0,0,w,h); const d=x.getImageData(0,0,w,h).data;
  const g=new Float32Array(w*h); for(let i=0;i<w*h;i++) g[i]=(d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114)/255*(d[i*4+3]/255)+(1-d[i*4+3]/255);
  const o=x.createImageData(w,h), od=o.data, th=P.imgThresh;
  const ink=i=>{ od[i*4]=17; od[i*4+1]=17; od[i*4+2]=17; od[i*4+3]=255; };
  if(P.imgMode==='threshold'){ for(let i=0;i<w*h;i++) if(g[i]<th) ink(i); }
  else if(P.imgMode==='scan'){ const gap=Math.max(3,Math.round(w/180)); for(let y=0;y<h;y++) for(let xx=0;xx<w;xx++){ const i=y*w+xx, v=g[i]; const band=(y%gap)/gap; if(v<th*0.5 || (band<(1-v)*0.9 && v<th+0.35)) ink(i); } }
  else { const T=0.08+th*1.2; for(let y=1;y<h-1;y++) for(let xx=1;xx<w-1;xx++){ const i=y*w+xx;
      const gx=-g[i-w-1]-2*g[i-1]-g[i+w-1]+g[i-w+1]+2*g[i+1]+g[i+w+1];
      const gy=-g[i-w-1]-2*g[i-w]-g[i-w+1]+g[i+w-1]+2*g[i+w]+g[i+w+1];
      if(Math.hypot(gx,gy)>T) ink(i); } }
  x.putImageData(o,0,0); imgProc=c;
}
function loadFile(f){
  if(!f || !f.type.startsWith('image/')) { toast(t('tPickImg')); return; }
  const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ img=im; processImage(); $('#imgInfo').textContent=`${f.name} · ${im.width}×${im.height}`; req(); }; im.src=r.result; }; r.readAsDataURL(f);
}

pad.addEventListener('pointerdown', e=>{ if(e.button>0) return; pad.setPointerCapture(e.pointerId); const q=norm(e); pointer=q;

  if(tool==='erase'){ snap(); erasing=true; eraseAt(q); req(); return; }
  const L=layers.find(l=>l.id===activeLayer); if(L && !L.visible){ L.visible=true; renderLayers(); toast(t('tHiddenLayer')); }
  cur={pts:[q], w:brushW, layer:activeLayer, id:nextId++}; req(); });
pad.addEventListener('pointermove', e=>{ pointer=norm(e);
  const evs=e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  if(cur){ for(const ev of (evs.length?evs:[e])){ const q=norm(ev), l=cur.pts[cur.pts.length-1]; if(Math.hypot(q[0]-l[0], q[1]-l[1])>0.0015) cur.pts.push(q); } }
  else if(erasing){ for(const ev of (evs.length?evs:[e])) eraseAt(norm(ev)); }
  req(); });
const end=()=>{ if(cur){ snap(); strokes.push(cur); cur=null; save(); renderLayers(); }
  if(erasing){ erasing=false; save(); renderLayers(); } req(); };
pad.addEventListener('pointerup', end);
pad.addEventListener('pointercancel', end);
pad.addEventListener('pointerleave', ()=>{ if(!cur && !erasing){ pointer=null; req(); } });

$('#tBrush').addEventListener('click', ()=>setTool('brush'));
$('#tErase').addEventListener('click', ()=>setTool('erase'));
$('#tSelect').addEventListener('click', ()=>setTool('select'));
$('#brushW').addEventListener('input', e=>{ brushW=+e.target.value; syncTools(); req(); savePrefs(); });
$('#eraseR').addEventListener('input', e=>{ eraseR=+e.target.value; syncTools(); req(); savePrefs(); });
let selEditing=false;
$('#selW').addEventListener('pointerdown', ()=>{ if(selected){ snap(); selEditing=true; } });
$('#selW').addEventListener('keydown', ()=>{ if(selected && !selEditing){ snap(); selEditing=true; } });
$('#selW').addEventListener('input', e=>{ if(!selected) return; if(!selEditing){ snap(); selEditing=true; } selected.w=+e.target.value; syncTools(); save(); req(); });
$('#selW').addEventListener('change', ()=>{ selEditing=false; });
function deleteSelected(){ if(!selected) return; snap(); strokes=strokes.filter(s=>s!==selected); selected=null; syncTools(); renderLayers(); save(); req(); }
$('#bDelStroke').addEventListener('click', deleteSelected);

/* ---------- layers ---------- */
function layerLabel(l, idx){ return l.name || (t('layerName')+' '+(idx+1)); }
function renderLayers(){
  const host=$('#lyrList'); host.innerHTML='';
  for(let i=layers.length-1;i>=0;i--){
    const l=layers[i], n=strokes.filter(s=>s.layer===l.id).length;
    const row=document.createElement('div'); row.className='lrow'+(l.id===activeLayer?' act':'')+(l.visible?'':' hid'); row.dataset.tip='layerRow';
    const eye=document.createElement('button'); eye.type='button'; eye.className='eye'; eye.setAttribute('aria-pressed', l.visible); eye.setAttribute('aria-label', t('lEye')); eye.title=t('lEye');
    eye.addEventListener('click', ev=>{ ev.stopPropagation(); snap(); l.visible=!l.visible; if(selected && selected.layer===l.id) selected=null; renderLayers(); syncTools(); save(); req(); });
    const nm=document.createElement('div'); nm.className='nm'; nm.textContent=layerLabel(l,i);
    const cnt=document.createElement('small'); cnt.textContent=n+(t('lCount')?' '+t('lCount'):''); nm.appendChild(cnt);
    nm.addEventListener('dblclick', ev=>{ ev.stopPropagation(); const inp=document.createElement('input'); inp.className='nm'; inp.value=layerLabel(l,i); inp.setAttribute('aria-label', t('layerName'));
      nm.replaceWith(inp); inp.focus(); inp.select();
      const done=()=>{ const v=inp.value.trim(); l.name=v||null; renderLayers(); save(); };
      inp.addEventListener('blur', done); inp.addEventListener('keydown', k=>{ if(k.key==='Enter') inp.blur(); if(k.key==='Escape'){ inp.value=layerLabel(l,i); inp.blur(); } }); });
    const ops=document.createElement('div'); ops.className='ops';
    const mk=(txt,lab,fn,dis)=>{ const b=document.createElement('button'); b.type='button'; b.textContent=txt; b.title=lab; b.setAttribute('aria-label',lab); if(dis){ b.disabled=true; b.style.opacity=.3; } b.addEventListener('click', ev=>{ ev.stopPropagation(); fn(); }); ops.appendChild(b); };
    mk('↑', t('lUp'), ()=>{ snap(); [layers[i],layers[i+1]]=[layers[i+1],layers[i]]; renderLayers(); save(); req(); }, i===layers.length-1);
    mk('↓', t('lDown'), ()=>{ snap(); [layers[i],layers[i-1]]=[layers[i-1],layers[i]]; renderLayers(); save(); req(); }, i===0);
    mk('×', t('lDel'), ()=>{ if(layers.length<2){ toast(t('tLastLayer')); return; } snap(); layers.splice(i,1); strokes=strokes.filter(s=>s.layer!==l.id);
      if(activeLayer===l.id) activeLayer=layers[Math.min(i,layers.length-1)].id; selected=null; renderLayers(); syncTools(); save(); req(); });
    row.append(eye, nm, ops);
    row.addEventListener('click', ()=>{ activeLayer=l.id; renderLayers(); save(); });
    host.appendChild(row);
  }
  const A=layers.find(l=>l.id===activeLayer); $('#layerW').value=A?A.w:1; $('#layerWo').textContent='×'+(A?A.w:1).toFixed(2);
}
$('#bAddLayer').addEventListener('click', ()=>{ snap(); const l=newLayer(); const idx=layers.findIndex(x=>x.id===activeLayer); layers.splice(idx+1,0,l); activeLayer=l.id; setTool('brush'); renderLayers(); save(); });
let lwEditing=false;
$('#layerW').addEventListener('input', e=>{ const A=layers.find(l=>l.id===activeLayer); if(!A) return; if(!lwEditing){ snap(); lwEditing=true; } A.w=+e.target.value; $('#layerWo').textContent='×'+A.w.toFixed(2); save(); req(); });
$('#layerW').addEventListener('change', ()=>{ lwEditing=false; });

let dragC=false;
const setCenter=e=>{ const q=norm(e,out); P.cx=+q[0].toFixed(3); P.cy=+q[1].toFixed(3); syncUI(); save(); req(); };
out.addEventListener('pointerdown', e=>{ if(e.button>0) return; dragC=true; out.setPointerCapture(e.pointerId); setCenter(e);
  if(!usesCenter()) toast(t('tCenter')); });
out.addEventListener('pointermove', e=>{ if(dragC) setCenter(e); });
out.addEventListener('pointerup', ()=>{ dragC=false; });
out.addEventListener('pointercancel', ()=>{ dragC=false; });

$('#showRef').addEventListener('change',e=>set('showRef', e.target.checked));
$('#lzh').addEventListener('click',()=>{ LANG='zh'; savePrefs(); applyLang(); });
$('#len').addEventListener('click',()=>{ LANG='en'; savePrefs(); applyLang(); });
$('#bTips').addEventListener('click',()=>{ TIPS_ON=!TIPS_ON; hideTip(); savePrefs(); $('#bTips').setAttribute('aria-pressed', TIPS_ON); toast(t(TIPS_ON?'tTipsOn':'tTipsOff')); });
$('#bOutPng').addEventListener('click', ()=>exportFile('out','png'));
$('#bOutSvg').addEventListener('click', ()=>exportFile('out','svg'));
$('#bOutPng2').addEventListener('click', ()=>exportFile('out','png'));
$('#bOutSvg2').addEventListener('click', ()=>exportFile('out','svg'));
$('#bPadPng').addEventListener('click', ()=>exportFile('pad','png'));
$('#bPadSvg').addEventListener('click', ()=>exportFile('pad','svg'));
$('#bReset').addEventListener('click', ()=>{ const keep=P.ratio, rz=P.rz; P={...clone(DEF), ratio:keep, rz}; processImage(); syncUI(); save(); req(); toast(t('tReset')); });
$('#bRand').addEventListener('click', randomize);
$('#bReseed').addEventListener('click', ()=>{ P.seed=Math.floor(Math.random()*1e6); syncUI(); save(); req(); });
$('#bUndo').addEventListener('click', undo);
$('#bClear').addEventListener('click', ()=>{ snap(); strokes=[]; selected=null; syncTools(); renderLayers(); save(); req(); toast(t('tClear')); });
$('#bPlain').addEventListener('click', plainSettings);
$('#bRandStrokes').addEventListener('click', randomStrokes);
$('#bSample') && $('#bSample').addEventListener('click', ()=>{ snap(); strokes=strokes.filter(s=>s.layer!==activeLayer).concat(sample()); selected=null; syncTools(); renderLayers(); save(); req(); });
$('#bImg').addEventListener('click', ()=>$('#file').click());
$('#file').addEventListener('change', e=>{ loadFile(e.target.files[0]); e.target.value=''; });
$('#bImgDel').addEventListener('click', ()=>{ img=null; imgProc=null; $('#imgInfo').textContent=t('imgHint'); req(); });

const stage=$('#stage');
stage.addEventListener('dragover', e=>{ e.preventDefault(); stage.classList.add('drop'); });
stage.addEventListener('dragleave', ()=>stage.classList.remove('drop'));
stage.addEventListener('drop', e=>{ e.preventDefault(); stage.classList.remove('drop'); const f=e.dataTransfer.files[0]; if(f) loadFile(f); });
window.addEventListener('paste', e=>{ const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith('image/')); if(f) loadFile(f); });

window.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase(); if(tag==='select' || (tag==='input' && e.target.type!=='range' && e.target.type!=='checkbox')) return;
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); }
  else if(!e.metaKey && !e.ctrlKey && e.key.toLowerCase()==='b'){ setTool('brush'); }
  else if(!e.metaKey && !e.ctrlKey && e.key.toLowerCase()==='d'){ randomStrokes(); }
  else if(!e.metaKey && !e.ctrlKey && e.key.toLowerCase()==='e'){ setTool('erase'); }
  else if(!e.metaKey && !e.ctrlKey && e.key.toLowerCase()==='v'){ setTool('select'); }
  else if((e.key==='Delete' || e.key==='Backspace') && selected){ e.preventDefault(); deleteSelected(); }
  else if(!e.metaKey && !e.ctrlKey && e.key.toLowerCase()==='r'){ randomize(); }
});

/* ---------- boot ---------- */
loadPrefs();
const fresh=!load();
Object.assign(P,{ showGrid:false, symOn:false, iso:false, fragOn:false, fluidOn:false, fragLine:false, cellLine:false });
if(P.sym==='none') P.sym='kaleido';
if(fresh){ layers=[newLayer()]; activeLayer=layers[0].id; strokes=sample(); }
resize(); applyLang(); req();
setTimeout(getDl, 0);
})();
</script>
