<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROUBERT — TOOLS</title>
<meta name="description" content="Roubert 的視覺實驗工具：網格、字形、拼貼、熱像，打開瀏覽器就能用。">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#111;--mute:#9a9a9a}
  html{background:#fff}
  body{color:var(--ink);font-family:"Helvetica Neue",Helvetica,"PingFang TC","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased;font-size:12px;letter-spacing:.04em}
  a{color:inherit;text-decoration:none}

  /* nav：四個字平均散開，像 houth */
  nav{position:fixed;top:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);padding:14px 2.4vw;mix-blend-mode:difference;color:#fff;text-transform:uppercase}
  nav span:nth-child(2){text-align:center}
  nav span:nth-child(3){text-align:center}
  nav span:nth-child(4){text-align:right}

  /* 作品牆：24 欄格線，每件作品自己決定起點、寬度、往下錯開多少 */
  main{display:grid;grid-template-columns:repeat(24,1fr);column-gap:1.6vw;padding:9vw 2.4vw 14vw;align-items:start}
  .w{display:block;grid-column:var(--c)/span var(--s);margin-top:var(--t,0);position:relative}
  .w img{width:100%;height:auto;display:block;background:#f3f3f1;transition:opacity .35s}
  .w figcaption{display:flex;justify-content:space-between;gap:1em;padding-top:8px;opacity:0;transform:translateY(-3px);transition:opacity .3s,transform .3s}
  .w figcaption i{font-style:normal;color:var(--mute)}
  main:hover .w img{opacity:.35}
  main .w:hover img{opacity:1}
  .w:hover figcaption,.w:focus-visible figcaption{opacity:1;transform:none}

  /* 每件作品的位置（桌機） */
  .a{--c:2; --s:7; --r:1}
  .b{--c:14;--s:6; --r:1;--t:9vw}
  .d{--c:6; --s:5; --r:2;--t:5vw}
  .e{--c:17;--s:5; --r:2;--t:2vw}
  .f{--c:1; --s:6; --r:3;--t:9vw}
  .g{--c:11;--s:6; --r:3;--t:15vw}
  .h{--c:13;--s:11;--r:4;--t:5vw}
  .w{grid-row:var(--r)}

  footer{padding:0 2.4vw 3vh;color:var(--mute);text-transform:uppercase;display:flex;justify-content:space-between}

  /* 手機：單欄，左右交錯，說明常駐 */
  @media (max-width:760px){
    nav{grid-template-columns:1fr 1fr;row-gap:4px;padding:12px 16px}
    nav span:nth-child(2){text-align:right}
    nav span:nth-child(3){text-align:left}
    main{grid-template-columns:repeat(12,1fr);column-gap:0;padding:80px 16px 60px;row-gap:56px}
    .w{grid-row:auto;margin-top:0}
    .a{--c:1;--s:10}.b{--c:5;--s:8}.d{--c:1;--s:8}.e{--c:6;--s:7}.f{--c:1;--s:9}.g{--c:4;--s:9}.h{--c:1;--s:12}
    .w figcaption{opacity:1;transform:none}
    main:hover .w img{opacity:1}
    footer{padding:0 16px 24px}
  }
</style>
</head>
<body>
<nav>
  <span>Roubert</span>
  <span>Tools (07)</span>
  <span>Browser-based visual experiments</span>
  <span>2026</span>
</nav>

<main>
  <a class="w a" href="ci-ge/"><figure><img src="covers/ci-ge.jpg" alt="磁格 Magnet Grid" width="1000" height="1323">
    <figcaption><span>磁格　Magnet Grid</span><i>網格 × 磁力</i></figcaption></figure></a>

  <a class="w b" href="slice-collage-lab/"><figure><img src="covers/slice-collage-lab.jpg" alt="切片拼貼實驗模組 Slice Collage Lab" width="857" height="1200">
    <figcaption><span>切片拼貼　Slice Collage Lab</span><i>切 / 拼</i></figcaption></figure></a>

  <a class="w d" href="nie-kan-kan/"><figure><img src="covers/nie-kan-kan.jpg" alt="捏看看 Face Warp" width="916" height="1160">
    <figcaption><span>捏看看　Face Warp</span><i>變形</i></figcaption></figure></a>

  <a class="w e" href="zhuo-zi/"><figure><img src="covers/zhuo-zi.jpg" alt="灼字 Burnt Glyph" width="543" height="816">
    <figcaption><span>灼字　Burnt Glyph</span><i>熱像 × 字形</i></figcaption></figure></a>

  <a class="w f" href="isolate/"><figure><img src="covers/isolate.jpg" alt="線稿隔離器 Isolate" width="1056" height="1052">
    <figcaption><span>線稿隔離器　Isolate</span><i>線稿</i></figcaption></figure></a>

  <a class="w g" href="zi-dao/"><figure><img src="covers/zi-dao.jpg" alt="字島 Glyph Island" width="1000" height="1277">
    <figcaption><span>字島　Glyph Island</span><i>文字繞島</i></figcaption></figure></a>

  <a class="w h" href="zi-wang/"><figure><img src="covers/zi-wang.jpg" alt="字網 Glyph Web" width="1200" height="750">
    <figcaption><span>字網　Glyph Web</span><i>字母連線</i></figcaption></figure></a>
</main>

<footer><span>© Roubert</span><span>Best in desktop Chrome</span></footer>
</body>
</html>
