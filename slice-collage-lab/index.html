<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>切片拼貼實驗模組</title>
<style>
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/instrument-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/instrument-sans-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/instrument-sans-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/instrument-sans-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/instrument-serif-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-display:swap;src:url('fonts/instrument-serif-latin-400-italic.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2')}
</style>
<style>
/* Layout: print-shop light table — header rail, white sheet on a pale bench, hairline inspector on the right, status strip below. Single deliberate light look. */
:root{
  color-scheme: light;
  --bench:#f3f3f1;
  --sheet:#ffffff;
  --ink:#43423f;
  --ink-2:#7a7973;
  --ink-3:#abaaa4;
  --hair:#e3e2de;
  --wash:#f5f5f3;
  --accent:#ff3d9a;
  --accent-soft:#ffe3f0;
  --f-ui:"Instrument Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-tc:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sheet);color:var(--ink);font-family:var(--f-ui);font-size:13px;padding-inline:16px;padding-block:12px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 284px;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top" "stage panel" "status panel";column-gap:0}

/* top rail */
.top{grid-area:top;display:flex;align-items:center;gap:16px;padding-bottom:12px;border-bottom:1px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-family:var(--f-tc);font-weight:400;font-size:21px;letter-spacing:.12em;line-height:1}
.brand .mark{width:12px;height:12px;background:var(--accent);border-radius:50%;align-self:center}
.brand small{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.doc{flex:1;min-width:0;font-family:var(--f-mono);font-size:11px;color:var(--ink-2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .actions{display:flex;gap:6px;align-items:center}

/* stage */
.stage{grid-area:stage;position:relative;min-height:0;min-width:0;background:var(--bench);touch-action:none;margin-top:12px}
.stage canvas{display:block;cursor:none}
.stage.drop::after{content:"放開以載入圖片";position:absolute;inset:12px;border:1.5px dashed var(--accent);display:grid;place-items:center;font-family:var(--f-tc);font-weight:400;color:var(--accent);background:rgba(255,255,255,.6)}
.gridpill{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.92);border:1px solid var(--hair);color:var(--ink-2);font:400 11.5px var(--f-tc);padding:5px 10px 5px 8px;border-radius:999px;cursor:pointer}
.gridpill:hover{border-color:var(--ink-3);color:var(--ink)}
.gridpill .ico{width:12px;height:12px;background-image:linear-gradient(currentColor 1px,transparent 1px),linear-gradient(90deg,currentColor 1px,transparent 1px);background-size:4px 4px;border:1px solid currentColor;opacity:.55}
.gridpill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.gridpill[aria-pressed="true"] .ico{opacity:1}
.tabs.dim{opacity:.35}
.sub{background:var(--wash);border-radius:5px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:9px;position:relative}
.pen #penCv{width:100%;aspect-ratio:1;background:#fff;border:1px solid var(--hair);border-radius:4px;cursor:crosshair;touch-action:none;display:block}
.pen #penCv:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shapeLib{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.shapeLib .slot{position:relative;padding:0;border:1px solid var(--hair);background:#fff;border-radius:3px;aspect-ratio:1;cursor:pointer}
.shapeLib .slot:hover{border-color:var(--ink-3)}
.shapeLib .slot.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.shapeLib canvas{display:block;width:100%;height:100%}
.shapeLib .empty{grid-column:1/-1;border:1px dashed var(--hair);border-radius:4px;color:var(--ink-3);font:11.5px/1.5 var(--f-tc);padding:10px;text-align:center;background:#fff}
.btn.small{padding:3px 7px;font-size:11.5px}
#penGrp::before{left:calc(90% - 6px)}
.minilbl{font-family:var(--f-tc);font-size:11.5px;color:var(--ink-2);margin-bottom:-3px}
#stampGrp::before{left:calc(16.6% - 6px)}
#tileGrp::before{left:calc(83.3% - 6px)}
.sub::before{content:"";position:absolute;top:-6px;left:calc(50% - 6px);border:6px solid transparent;border-top:0;border-bottom-color:var(--wash)}
.sub .tag{font-size:9.5px;color:var(--accent);letter-spacing:.16em}
.sub .hint{margin:0;font-family:var(--f-tc);font-size:11.5px;line-height:1.55;color:var(--ink-2)}
.edgeSub{display:flex;flex-direction:column;gap:6px;transition:opacity .15s}
.edgeSub.dim{opacity:.4}
.toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:6px 12px;border-radius:999px;pointer-events:none;transition:opacity .2s;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.status{grid-area:status;display:flex;gap:14px;align-items:center;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);padding-block:8px;white-space:nowrap;overflow:hidden;min-width:0}
.status b{color:var(--ink);font-weight:400}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.status .dot.erase{background:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink),0 0 0 1px #fff}
.status .sp{flex:1}

/* inspector */
.panel{grid-area:panel;min-height:0;overflow-y:auto;border-left:1px solid var(--hair);margin-top:12px;padding:0 0 12px 18px;display:flex;flex-direction:column}
.grp{padding-block:14px;border-bottom:1px solid var(--hair);display:flex;flex-direction:column;gap:10px}
.grp:first-child{padding-top:2px}
.grp:last-child{border-bottom:0}
.lbl{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.lbl span:first-child{font-family:var(--f-tc);letter-spacing:.2em;font-size:11px;color:var(--ink);font-weight:500;text-transform:none}
kbd{font-family:var(--f-mono);font-size:10px;color:var(--ink-2);border:1px solid var(--hair);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--sheet)}

.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.tabs button{background:var(--sheet);border:0;border-left:1px solid var(--ink);color:var(--ink);font:400 12px var(--f-tc);padding:7px 2px;cursor:pointer;white-space:nowrap}
.tabs button:first-child{border-left:0}
.tabs button:hover{background:var(--wash)}
.tabs button.on{background:var(--ink);color:#fff}
.tabs.shape button{font-size:15px;line-height:1;padding:6px 0}
.tabs.small button{font-size:11.5px;padding:5px 2px}

.btn{background:var(--sheet);border:1px solid var(--hair);color:var(--ink);font:400 12px var(--f-tc);padding:6px 11px;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#5a5955}
.btn.pink{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pink:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;padding-inline:8px}
.btn.ghost:hover{border-color:var(--hair)}
.btn.lang{font-family:var(--f-ui);min-width:52px;justify-content:center;color:var(--ink-2)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.slider{display:grid;grid-template-columns:50px 1fr 58px;align-items:center;gap:10px}
.slider label{font-family:var(--f-tc);color:var(--ink-2);font-size:12px}
.numbox{display:inline-flex;align-items:baseline;justify-self:end;gap:2px;border-bottom:1px solid var(--hair);padding-bottom:1px}
.numbox:focus-within{border-bottom-color:var(--accent)}
.num{width:4.6ch;min-width:0;border:0;background:transparent;font:400 11px var(--f-mono);color:var(--ink);text-align:right;padding:2px 0;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num:focus{outline:none}
.numbox i{font:normal 9.5px var(--f-mono);color:var(--ink-3)}
.tip{position:fixed;z-index:20;max-width:240px;background:var(--ink);color:#fff;font:400 11.5px/1.5 var(--f-tc);padding:7px 10px;border-radius:5px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.btn.toggle[aria-pressed="true"]{border-color:var(--ink-3);color:var(--ink)}
.btn.toggle[aria-pressed="false"]{color:var(--ink-3)}
.btn.toggle .q{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;border:1px solid currentColor;font:500 9.5px var(--f-mono)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink);margin-top:-6px}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink)}
input[type=range]:hover::-webkit-slider-thumb{background:var(--accent);border-color:var(--accent)}
input[type=range]:hover::-moz-range-thumb{background:var(--accent);border-color:var(--accent)}

.sw{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;font-family:var(--f-tc);font-size:12px;color:var(--ink-2)}
.sw .t{display:flex;gap:6px;align-items:center}
.sw input{appearance:none;-webkit-appearance:none;width:26px;height:14px;border-radius:999px;background:var(--hair);position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--ink)}
.sw input:checked::after{transform:translateX(12px)}
.sws{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.buf{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;min-height:42px}
.buf .slot{position:relative;padding:0;border:0;background:none;cursor:pointer;border-radius:2px;outline:1px solid var(--hair);outline-offset:-1px;aspect-ratio:1;overflow:hidden}
.buf .slot canvas{display:block;width:100%;height:100%;opacity:.72;transition:opacity .12s}
.buf .slot:hover canvas,.buf .slot.sel canvas{opacity:1}
.buf .slot.sel{outline:2px solid var(--accent);outline-offset:-2px}
.buf .slot .n{position:absolute;left:2px;bottom:1px;font-family:var(--f-mono);font-size:9px;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.6)}
.buf .empty{grid-column:1/-1;border:1px dashed var(--hair);border-radius:4px;color:var(--ink-3);font-family:var(--f-tc);font-size:11.5px;display:grid;place-items:center;padding:12px 8px;text-align:center}

details.keys summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.keys summary::-webkit-details-marker{display:none}
details.keys summary::after{content:"+";font-family:var(--f-mono);color:var(--ink-3)}
details.keys[open] summary::after{content:"−"}
.keys dl{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:10px 0 0;font-family:var(--f-tc);font-size:11.5px;color:var(--ink-2)}
.keys dt{justify-self:start}
.keys dd{margin:0}

.modal{position:fixed;inset:0;background:rgba(21,21,21,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal .box{background:var(--sheet);border:1px solid var(--ink);border-radius:6px;padding:16px;max-width:min(720px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal img{max-width:100%;max-height:60vh;object-fit:contain;background:var(--bench)}
.modal p{margin:0;color:var(--ink-2);font-family:var(--f-tc);line-height:1.6}
.dlg{max-width:440px}
.dlg h3{margin:0;font:500 15px var(--f-tc);letter-spacing:.06em;color:var(--ink)}
.dlgBtns{justify-content:flex-end}
.modal a{color:var(--accent);font-weight:500}

/* tablet (iPad portrait / small laptop): keep the side-by-side layout, slimmer panel, compact header */
@media (max-width:1180px){
  .app{grid-template-columns:minmax(0,1fr) 264px}
  .doc{display:none}
  .top{gap:10px;flex-wrap:wrap}
  .top .actions{gap:4px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
  .top .btn{padding:6px 9px}
  .brand small{display:none}
  .panel{padding-left:14px}
}
.app.nopanel{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "stage" "status"}
.app.nopanel .panel{display:none}
.btn.panelbtn[aria-pressed="false"]{color:var(--ink-3)}
#btnCapture[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:600px){ #btnPanel{display:none} }
@media (max-width:600px){
  html,body{height:auto}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 60vh auto auto;grid-template-areas:"top" "stage" "status" "panel";height:auto}
  .panel{border-left:0;padding-left:0;overflow:visible;border-top:1px solid var(--ink)}
  .doc{display:none}
}
@media (prefers-reduced-motion:reduce){.toast,.sw input,.sw input::after{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1 data-i18n="title">切片拼貼實驗模組</h1><small>SLICE COLLAGE LAB 0.3</small></div>
    <div class="doc" id="docChip"></div>
    <div class="actions">
      <button class="btn ghost panelbtn" id="btnPanel" aria-pressed="true"><span data-i18n="panelBtn">面板</span></button>
      <button class="btn ghost lang" id="btnLang" data-i18n="langBtn">EN</button>
      <button class="btn ghost toggle" id="btnTips" aria-pressed="true"><span class="q" aria-hidden="true">?</span><span data-i18n="tipsBtn">提示</span></button>
      <button class="btn" id="btnLoad" data-i18n="load">載入圖片</button>
      <button class="btn" id="btnSvg" data-i18n="exportSvg">匯出 SVG</button>
      <button class="btn" id="btnPsd" data-i18n="exportPsd">匯出 PSD</button>
      <button class="btn pink" id="btnExport" data-i18n="export">匯出 PNG</button>
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
    </div>
  </header>

  <div class="stage" id="stage"><div class="toast" id="toast" hidden></div><button type="button" class="gridpill" id="gridPill" aria-pressed="false"><span class="ico" aria-hidden="true"></span><span id="gridPillTxt"></span></button></div>
  <div class="status" id="statusChip"></div>

  <aside class="panel" id="panel">
    <div class="grp">
      <div class="lbl"><span data-i18n="draw">繪製</span><kbd>M</kbd></div>
      <div class="tabs" data-key="draw"></div>
      <div class="sws">
        <label class="sw"><span class="t"><span data-i18n="erase">橡皮擦</span> <kbd>E</kbd></span><input type="checkbox" id="erase"></label>
      </div>
      <div class="sub" id="stampGrp">
        <div class="lbl"><span data-i18n="stampH">蓋印設定</span><span class="tag" data-i18n="stampTag"></span></div>
        <label class="sw"><span class="t" data-i18n="followPath"></span><input type="checkbox" id="followPath"></label>
        <div class="slider"><label for="sizeEnd" data-i18n="sizeEnd"></label><input type="range" id="sizeEnd" min="0.1" max="3" step="0.05"><span class="numbox"><input type="number" class="num" id="sizeEndOut" inputmode="decimal"><i id="sizeEndUnit"></i></span></div>
        <div class="slider"><label for="sizeSteps" data-i18n="sizeSteps"></label><input type="range" id="sizeSteps" min="2" max="60" step="1"><span class="numbox"><input type="number" class="num" id="sizeStepsOut" inputmode="decimal"><i id="sizeStepsUnit"></i></span></div>
        <p class="hint" data-i18n="sizeHint"></p>
        <div class="slider"><label for="driftX" data-i18n="driftX"></label><input type="range" id="driftX" min="-80" max="80" step="1"><span class="numbox"><input type="number" class="num" id="driftXOut" inputmode="decimal"><i id="driftXUnit"></i></span></div>
        <div class="slider"><label for="driftY" data-i18n="driftY"></label><input type="range" id="driftY" min="-80" max="80" step="1"><span class="numbox"><input type="number" class="num" id="driftYOut" inputmode="decimal"><i id="driftYUnit"></i></span></div>
        <p class="hint" data-i18n="driftHint"></p>
      </div>
      <div class="sub" id="tileGrp">
        <div class="lbl"><span data-i18n="tileH">平鋪設定</span><span class="tag" data-i18n="tileTag"></span></div>
        <p class="hint" data-i18n="tileHint"></p>
        <div class="minilbl" data-i18n="layout"></div>
        <div class="tabs small" data-key="tileLayout"></div>
        <div class="minilbl" data-i18n="pattern"></div>
        <div class="tabs small" data-key="tilePattern"></div>
      </div>
      <div class="sub" id="stretchGrp">
        <div class="lbl"><span data-i18n="stretchH">拉伸設定</span><span class="tag" data-i18n="stretchTag">STRETCH</span></div>
        <p class="hint" data-i18n="stretchHint"></p>
        <label class="sw"><span class="t" data-i18n="stretchFree">自由角度</span><input type="checkbox" id="stretchFree"></label>
        <label class="sw" id="angleSnapRow"><span class="t" data-i18n="angleSnap">角度吸附 15°</span><input type="checkbox" id="angleSnap"></label>
        <label class="sw"><span class="t" data-i18n="stretchEdge">邊緣拉絲</span><input type="checkbox" id="stretchEdge"></label>
        <div class="edgeSub" id="edgeSub">
          <div class="slider"><label for="edgeW" data-i18n="edgeW">邊緣寬</label><input type="range" id="edgeW" min="1" max="60" step="1"><span class="numbox"><input type="number" class="num" id="edgeWOut" inputmode="decimal"><i id="edgeWUnit"></i></span></div>
          <div class="slider"><label for="fade" data-i18n="fade">淡出</label><input type="range" id="fade" min="0" max="1" step="0.01"><span class="numbox"><input type="number" class="num" id="fadeOut" inputmode="decimal"><i id="fadeUnit"></i></span></div>
          <div class="slider"><label for="jitter" data-i18n="jitter">抖動</label><input type="range" id="jitter" min="0" max="1" step="0.01"><span class="numbox"><input type="number" class="num" id="jitterOut" inputmode="decimal"><i id="jitterUnit"></i></span></div>
        </div>
      </div>
    </div>

    <div class="grp">
      <div class="lbl"><span data-i18n="sampleH">取樣</span><kbd>S</kbd></div>
      <div class="tabs small" data-key="sample"></div>
      <div class="sws">
        <label class="sw"><span class="t" data-i18n="sampleComp">從合成取樣</span><input type="checkbox" id="sampleComp"></label>
        <label class="sw"><span class="t"><span data-i18n="showSrc">顯示原圖</span> <kbd>I</kbd></span><input type="checkbox" id="showSrc"></label>
      </div>
    </div>

    <div class="grp">
      <div class="lbl"><span data-i18n="brush">筆刷</span><span>W × H</span></div>
      <div class="slider"><label for="bw" data-i18n="w">寬</label><input type="range" id="bw" min="4" max="800" step="1"><span class="numbox"><input type="number" class="num" id="bwOut" inputmode="decimal"><i id="bwUnit"></i></span></div>

  const lh = new DataView(new ArrayBuffer(30)); lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
  lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, nm.length, true);
  const ch = new DataView(new ArrayBuffer(46)); ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
  ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, nm.length, true); ch.setUint32(42, 0, true);
  const cdOff = 30 + nm.length + size, cdLen = 46 + nm.length;
  const end = new DataView(new ArrayBuffer(22)); end.setUint32(0, 0x06054b50, true); end.setUint16(8, 1, true); end.setUint16(10, 1, true); end.setUint32(12, cdLen, true); end.setUint32(16, cdOff, true);
  return new Blob([lh.buffer, nm, data, ch.buffer, nm, end.buffer], {type:'application/zip'});
}
const PSD_WARN = 120;
async function exportPSD(){
  if(!ops.some(op => op.slice) && !S.showSrc){ toast(t('psdEmpty')); return; }
  const count = ops.filter(op => op.slice).length;
  let perSlice = true;
  if(count >= PSD_WARN){
    const strokes = new Set(ops.filter(op => op.slice).map(op => op.sid)).size;
    const v = await askDialog(t('psdDlgTitle'), t('psdDlgText', count, strokes),
      [{value:'cancel', label:t('cancel')}, {value:'stroke', label:t('psdPerStroke', strokes)}, {value:'slice', label:t('psdPerSlice', count), primary:true}]);
    if(v === 'cancel') return;
    perSlice = v === 'slice';
  }
  toast(t('psdBuilding'));
  let ag;
  try{ ag = await loadAgPsd(); }catch(e){ toast(t('psdLoadFail')); return; }
  await new Promise(r => setTimeout(r, 30));
  const comp = mk(docW, docH), cg = comp.getContext('2d');
  if(S.showSrc) cg.drawImage(srcC, 0, 0);
  cg.drawImage(outC, 0, 0);
  const children = [];
  if(S.showSrc){ const sc = mk(docW, docH); sc.getContext('2d').drawImage(srcC, 0, 0); children.push({name:'source', canvas:sc, left:0, top:0}); }
  children.push({name:'collage', opened:true, children:buildPsdLayers(perSlice)});
  const buf = ag.writePsd({width:docW, height:docH, children, canvas:comp});
  const base = stampName('psd');
  if(downloads) await saveBlob(zipOne(base, new Uint8Array(buf)), base.replace(/\.psd$/, '.zip'), comp.toDataURL('image/png'));
  else await saveBlob(new Blob([buf], {type:'image/vnd.adobe.photoshop'}), base);
}

function askDialog(title, text, buttons){
  return new Promise(res => {
    $('dlgTitle').textContent = title; $('dlgText').textContent = text;
    const row = $('dlgBtns'); row.textContent = '';
    const done = v => { $('dlg').hidden = true; document.removeEventListener('keydown', onKey, true); res(v); };
    const onKey = e => { if(e.key === 'Escape'){ e.stopPropagation(); done('cancel'); } };
    buttons.forEach(bt => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn' + (bt.primary ? ' dark' : ''); b.textContent = bt.label; b.addEventListener('click', () => done(bt.value)); row.appendChild(b); });
    document.addEventListener('keydown', onKey, true);
    $('dlg').hidden = false; row.lastChild.focus();
  });
}

let tipTimer = null;
function hideTip(){ clearTimeout(tipTimer); $('tip').hidden = true; }
function bindTips(){

    btnRot:'rot', btnClearBuf:'clearStash', btnUndo:'undo', btnClear:'clearCanvas', btnSample:'sampleImg', buf:'stash'};
  Object.entries(map).forEach(([id, k]) => { $(id).dataset.tip = k; });

  Object.keys(NUM).forEach(k => { const row = $(k).closest('.slider'); if(row) row.dataset.tip = k; });
  document.addEventListener('mouseover', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if(!S.tips || !el || matchMedia('(hover: none)').matches){ hideTip(); return; }
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => {
      const tip = $('tip'); tip.textContent = t('tip_' + el.dataset.tip); tip.hidden = false;
      const b = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;

  });

function selectSlice(i){
  if(i < 0 || i >= buffer.length) return;
  bufIdx = i;
  if(S.sample !== 'buffer'){ S.sample = 'buffer'; savePrefs(); }
  renderBuffer(); syncUI(); toast(t('picked', i+1));
}
function removeSlice(i){
  buffer.splice(i, 1);
  if(bufIdx >= buffer.length) bufIdx = Math.max(0, buffer.length - 1);
  else if(i < bufIdx) bufIdx--;
  renderBuffer(); toast(t('removed', i+1));
}
function clearBuffer(){ buffer = []; bufIdx = 0; renderBuffer(); toast(t('stashCleared')); }
function clearCanvas(){ pushUndo(); clearOut(); toast(t('canvasCleared')); }

function toggleGrid(){ S.gridOn = !S.gridOn; toast(t(S.gridOn ? 'gridOn' : 'gridOff')); syncUI(); savePrefs(); }
function syncUI(){
  $('gridPill').setAttribute('aria-pressed', S.gridOn); $('gridPillTxt').textContent = t(S.gridOn ? 'gridPillOn' : 'gridPillOff');
  $('gridStyle').classList.toggle('dim', !S.gridOn);
  $('stretchGrp').hidden = S.draw !== 'stretch';
  $('stampGrp').hidden = S.draw !== 'stamp';
  $('tileGrp').hidden = S.draw !== 'tile';
  $('penGrp').hidden = S.shape !== 'free'; if(S.shape === 'free') drawPen();
  $('edgeSub').classList.toggle('dim', !S.stretchEdge);
  $('angleSnapRow').hidden = !S.stretchFree;
  document.querySelectorAll('.tabs').forEach(el => el.querySelectorAll('button').forEach(b => b.classList.toggle('on', S[el.dataset.key] === b.dataset.val)));
  Object.keys(RANGES).forEach(k => { const el = $(k); if(+el.value !== S[k]) el.value = S[k]; });
  if(document.activeElement !== $('spacing')) $('spacing').value = spToSlider(S.spacing);
  Object.keys(NUM).forEach(k => syncNum(k));
  $('btnTips').setAttribute('aria-pressed', S.tips);
  document.querySelector('.app').classList.toggle('nopanel', !S.panelOpen); $('btnPanel').setAttribute('aria-pressed', S.panelOpen);
  $('btnCapture').setAttribute('aria-pressed', captureNext);
  CHECKS.forEach(k => { $(k).checked = !!S[k]; });
  $('rotTxt').textContent = `${t('rot')} ${S.rot*90}°`;
  $('docChip').innerHTML = `${escapeHtml(isSample ? t('sampleDoc') : docName)}　${docW} × ${docH} px`;
  updateStatus();
}
let lastStatus = '';
function updateStatus(){
  const fp = footprint();
  const p = hover ? toDoc(hover.x, hover.y) : null;
  const s = `<span class="dot${S.erase ? ' erase' : ''}"></span><b>${t(S.erase ? 'erase' : S.draw)}</b><span>${t(S.sample)}</span><span>${t(S.shape)} ${S.rot*90}°</span><span>${t('st_brush')} ${fp.w}×${fp.h}</span><span>${t('st_grid')} ${S.gw}×${S.gh}${S.snap ? ' · ' + t('st_snap') : ''}</span><span class="sp"></span>`
    + (p ? `<span>X ${String(Math.round(p.x)).padStart(4,' ')}　Y ${String(Math.round(p.y)).padStart(4,' ')}</span>` : '');
  if(s !== lastStatus){ $('statusChip').innerHTML = s; lastStatus = s; }
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renderBuffer(){
  const el = $('buf'); el.textContent = '';
  $('bufCount').textContent = `${buffer.length} / ${BUF_MAX}`;
  if(!buffer.length){ const s = document.createElement('span'); s.className = 'empty'; s.textContent = t('emptyStash'); el.appendChild(s); return; }
  buffer.forEach((sl,i) => {
    const c = mk(80,80), g = c.getContext('2d');
    const k = Math.max(80/sl.sw, 80/sl.sh);
    g.drawImage(sl.c, sl.sx, sl.sy, sl.sw, sl.sh, (80-sl.sw*k)/2, (80-sl.sh*k)/2, sl.sw*k, sl.sh*k);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'slot' + (i === bufIdx ? ' sel' : '');
    b.title = t('sliceTitle', i+1, sl.sw, sl.sh);
    b.setAttribute('aria-label', t('slice', i+1)); b.setAttribute('aria-pressed', i === bufIdx);
    const n = document.createElement('span'); n.className = 'n'; n.textContent = i + 1;
    b.append(c, n);
    b.addEventListener('click', () => selectSlice(i));
    b.addEventListener('contextmenu', e => { e.preventDefault(); removeSlice(i); });
    el.appendChild(b);
  });
}

/* ---------- input ---------- */
function localXY(e){ const b = cnv.elt.getBoundingClientRect(); return {x:e.clientX - b.left, y:e.clientY - b.top}; }
function bindCanvas(){
  const el = cnv.elt;
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    const l = localXY(e), p = toDoc(l.x, l.y); hover = l;
    if(e.pointerType === 'touch'){
      touches.set(e.pointerId, l);
      if(touches.size === 2){
        // second finger: cancel the stroke the first finger started and pinch-resize the brush instead
        if(stroke){ stroke = null; const u = undoStack.pop(); if(u){ const g = outCtx(); g.clearRect(0,0,docW,docH); g.drawImage(u.c,0,0); ops = u.ops; } }
        const [a, b] = [...touches.values()];
        pinch = {d:Math.hypot(a.x - b.x, a.y - b.y) || 1, bw:S.bw, bh:S.bh, cx:(a.x + b.x)/2, cy:(a.y + b.y)/2};
        return;
      }
      if(touches.size > 2) return;
    }
    if(captureNext && e.button === 0){ captureNext = false; capture(p); syncUI(); return; }
    if(e.button === 2){ resizing = {x:l.x, y:l.y, bw:S.bw, bh:S.bh}; return; }
    if(e.button !== 0) return;
    if(e.shiftKey){ capture(p); return; }
    beginStroke(p);
  });
  el.addEventListener('pointermove', e => {
    const l = localXY(e);
    if(e.pointerType === 'touch' && touches.has(e.pointerId)) touches.set(e.pointerId, l);
    if(pinch){
      if(touches.size >= 2){ const [a, b] = [...touches.values()], k = Math.hypot(a.x - b.x, a.y - b.y) / pinch.d;
        S.bw = clampN(Math.round(pinch.bw * k), 4, 2000); S.bh = clampN(Math.round(pinch.bh * k), 4, 2000); hover = {x:pinch.cx, y:pinch.cy}; syncUI(); }
      return;
    }
    hover = l;
    if(resizing){
      S.bw = clampN(Math.round(resizing.bw + (l.x - resizing.x)/view.s), 4, 2000);
      S.bh = clampN(Math.round(resizing.bh + (l.y - resizing.y)/view.s), 4, 2000);
      syncUI(); return;
    }
    if(stroke){ stroke.free = e.altKey; dragStroke(toDoc(l.x, l.y)); }
  });
  const up = e => {
    if(e.pointerType === 'touch'){ touches.delete(e.pointerId); if(pinch){ if(touches.size === 0){ pinch = null; savePrefs(); } return; } }
    if(resizing){ resizing = null; savePrefs(); }
    if(stroke){ const l = localXY(e); endStroke(toDoc(l.x, l.y), e.altKey); }
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', e => { if(!stroke && !resizing) hover = null; });
  el.addEventListener('wheel', e => {
    e.preventDefault();
    const d = e.deltaY || e.deltaX, f = Math.exp(-d * 0.0015);
    if(!e.altKey) S.bw = clampN(Math.round(S.bw * f), 4, 2000);
    if(!e.shiftKey) S.bh = clampN(Math.round(S.bh * f), 4, 2000);
    syncUI(); savePrefs();
  }, {passive:false});
}
function bindKeys(){
  document.addEventListener('keydown', e => {
    if(e.target.closest && e.target.closest('input,select,textarea')) return;
    const k = e.key.toLowerCase();
    if((e.metaKey || e.ctrlKey) && k === 'z'){ e.preventDefault(); undo(); return; }
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    const cyc = (key, list) => { const i = list.findIndex(x => x[0] === S[key]); S[key] = list[(i+1) % list.length][0]; toast(t(S[key])); };
    const step = e.shiftKey ? 1 : 4;
    let handled = true;
    switch(k){
      case 'm': cyc('draw', DRAW_MODES); break;
      case 's': cyc('sample', SAMPLE_MODES); break;
      case 't': cyc('shape', SHAPES); break;
      case 'a': clearBuffer(); break;
      case 'e': S.erase = !S.erase; toast(t(S.erase ? 'eraseOn' : 'eraseOff')); break;
      case 'r': S.rot = (S.rot+1) % 4; break;
      case 'i': S.showSrc = !S.showSrc; break;
      case 'c': clearCanvas(); break;
      case 'd': exportPNG(); break;
      case 'v': exportSVG(); break;
      case 'p': exportPSD(); break;
      case 'g': S.snap = !S.snap; toast(t(S.snap ? 'snapOn' : 'snapOff')); break;
      case 'h': toggleGrid(); break;
      case '[': S.bw = Math.max(4, Math.round(S.bw/1.15)); S.bh = Math.max(4, Math.round(S.bh/1.15)); break;
      case ']': S.bw = Math.min(2000, Math.round(S.bw*1.15)); S.bh = Math.min(2000, Math.round(S.bh*1.15)); break;
      case 'arrowleft': S.gw = Math.max(4, S.gw - step); break;
      case 'arrowright': S.gw = Math.min(400, S.gw + step); break;
      case 'arrowup': S.gh = Math.min(400, S.gh + step); break;
      case 'arrowdown': S.gh = Math.max(4, S.gh - step); break;
      default:
        if(/^[1-9]$/.test(k) && buffer.length){ selectSlice(+k - 1); }
        else handled = false;
    }
    if(handled){ e.preventDefault(); syncUI(); savePrefs(); }
  });
  window.addEventListener('dragover', e => { e.preventDefault(); stageEl.classList.add('drop'); });
  window.addEventListener('dragleave', e => { if(!e.relatedTarget) stageEl.classList.remove('drop'); });
  window.addEventListener('drop', e => { e.preventDefault(); stageEl.classList.remove('drop'); loadFile(e.dataTransfer.files[0]); });
  window.addEventListener('paste', e => { const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/')); if(f) loadFile(f); });
}

/* ---------- p5 ---------- */
function setup(){
  stageEl = $('stage');
  cnv = createCanvas(Math.max(10, stageEl.clientWidth), Math.max(10, stageEl.clientHeight));
  cnv.parent(stageEl);
  pixelDensity(Math.min(2, window.devicePixelRatio || 1));
  const pc = mk(16,16), pg = pc.getContext('2d');
  pg.fillStyle = '#ffffff'; pg.fillRect(0,0,16,16); pg.fillStyle = '#ececea'; pg.fillRect(0,0,8,8); pg.fillRect(8,8,8,8);
  checker = drawingContext.createPattern(pc, 'repeat');
  bindUI(); bindCanvas(); bindKeys();
  new ResizeObserver(() => { resizeCanvas(Math.max(10, stageEl.clientWidth), Math.max(10, stageEl.clientHeight)); fitView(); }).observe(stageEl);
  loadSample(true); applyLang();
  const ready = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('700 100px "Instrument Sans"'), document.fonts.load('600 30px "Instrument Sans"'), document.fonts.load('400 27px "Instrument Sans"'), document.fonts.load('italic 400 100px "Instrument Serif"'), document.fonts.load('400 27px "Noto Sans TC"', '從任何一張圖')]) : Promise.resolve();
  ready.then(() => { if(isSample && undoStack.length === 0) loadSample(true); }).catch(()=>{});
}

function drawRulers(ctx){
  // screen-space px rulers along the sheet's top and left edges
  const s = view.s, steps = [10,25,50,100,200,250,500,1000,2000];
  const major = steps.find(v => v*s >= 70) || 2000, minor = major/5;
  ctx.save();
  ctx.font = '500 9.5px "JetBrains Mono", monospace'; ctx.fillStyle = '#9a9a96'; ctx.strokeStyle = '#b8b8b4'; ctx.lineWidth = 1;
  ctx.beginPath();
  for(let x = 0; x <= docW + 0.5; x += minor){
    const sx = Math.round(view.ox + x*s) + .5, isMaj = Math.abs(x/major - Math.round(x/major)) < 1e-6;
    ctx.moveTo(sx, view.oy - 4); ctx.lineTo(sx, view.oy - (isMaj ? 11 : 6));
    if(isMaj) ctx.fillText(String(Math.round(x)), sx + 3, view.oy - 6);
  }
  for(let y = 0; y <= docH + 0.5; y += minor){
    const sy = Math.round(view.oy + y*s) + .5, isMaj = Math.abs(y/major - Math.round(y/major)) < 1e-6;
    ctx.moveTo(view.ox - 4, sy); ctx.lineTo(view.ox - (isMaj ? 11 : 6), sy);
    if(isMaj && y > 0){ ctx.save(); ctx.translate(view.ox - 6, sy - 3); ctx.rotate(-Math.PI/2); ctx.fillText(String(Math.round(y)), 0, 0); ctx.restore(); }
  }
  ctx.stroke();
  ctx.restore();
}

function draw(){
  clear();
  const ctx = drawingContext, s = view.s;
  drawRulers(ctx);
  ctx.save();
  ctx.translate(view.ox, view.oy); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(20,20,20,.10)'; ctx.shadowBlur = 18/s; ctx.shadowOffsetY = 2/s;
  ctx.fillStyle = S.showSrc ? '#ffffff' : checker; ctx.fillRect(0, 0, docW, docH);
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; ctx.shadowColor = 'transparent';
  if(S.showSrc) ctx.drawImage(srcC, 0, 0);
  ctx.drawImage(outC, 0, 0);

  if(stroke && hover){
    const p = toDoc(hover.x, hover.y);
    if(stroke.mode === 'stretch') drawStretch(ctx, p, stroke.free);
    if(stroke.mode === 'tile'){ drawTiles(ctx, p); const R = tileRect(p); ctx.lineWidth = 1/s; ctx.strokeStyle = '#ff3d9a'; ctx.strokeRect(R.x, R.y, R.w, R.h); }
  }

  if(S.gridOn && S.gridView === 'all'){
    ctx.save(); ctx.beginPath();
    for(let x = S.gw; x < docW; x += S.gw){ ctx.moveTo(x, 0); ctx.lineTo(x, docH); }
    for(let y = S.gh; y < docH; y += S.gh){ ctx.moveTo(0, y); ctx.lineTo(docW, y); }
    ctx.globalCompositeOperation = 'difference'; ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1/s; ctx.stroke();
    ctx.restore();
  } else if(S.gridOn && S.gridView === 'near' && hover && !stroke){
    // small crosses at nearby grid intersections, fading out with distance
    const p = toDoc(hover.x, hover.y), rad = Math.max(S.gw, S.gh) * 4, arm = 4/s;
    const x0 = Math.max(0, Math.floor((p.x - rad)/S.gw)*S.gw), x1 = Math.min(docW, p.x + rad);
    const y0 = Math.max(0, Math.floor((p.y - rad)/S.gh)*S.gh), y1 = Math.min(docH, p.y + rad);
    ctx.save(); ctx.globalCompositeOperation = 'difference'; ctx.lineWidth = 1/s;
    for(let x = x0; x <= x1; x += S.gw) for(let y = y0; y <= y1; y += S.gh){
      const a = 1 - Math.hypot(x - p.x, y - p.y)/rad; if(a <= 0) continue;
      ctx.strokeStyle = `rgba(255,255,255,${(a*.75).toFixed(3)})`;
      ctx.beginPath(); ctx.moveTo(x - arm, y); ctx.lineTo(x + arm, y); ctx.moveTo(x, y - arm); ctx.lineTo(x, y + arm); ctx.stroke();
    }
    ctx.restore();
  }

  if(hover){
    const anchor = resizing ? {x:resizing.x, y:resizing.y} : hover;
    const p = toDoc(anchor.x, anchor.y), r = rectAt(p.x, p.y);
    const odd = S.rot % 2, dw = odd ? r.h : r.w, dh = odd ? r.w : r.h;
    ctx.save();
    ctx.translate(r.x + r.w/2, r.y + r.h/2); ctx.rotate(S.rot*Math.PI/2);
    shapePath(ctx, S.shape, dw, dh, S.customPath);
    if(S.sample === 'buffer' && buffer.length && !S.erase && !stroke){
      const sl = buffer[Math.min(bufIdx, buffer.length-1)];
      ctx.save(); ctx.clip(); ctx.globalAlpha = .65; ctx.drawImage(sl.c, sl.sx, sl.sy, sl.sw, sl.sh, -dw/2, -dh/2, dw, dh); ctx.restore();
    }
    ctx.lineWidth = 3.5/s; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.stroke();
    ctx.setLineDash(S.erase ? [5/s, 4/s] : []);
    ctx.lineWidth = 1.25/s; ctx.strokeStyle = S.erase ? '#43423f' : '#ff3d9a'; ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(-5/s, 0); ctx.lineTo(5/s, 0); ctx.moveTo(0, -5/s); ctx.lineTo(0, 5/s); ctx.stroke();
    ctx.restore();
  }

  if(flash){
    const a = 1 - (performance.now() - flash.t)/500;
    if(a <= 0) flash = null;
    else { ctx.fillStyle = `rgba(255,61,154,${a*.35})`; ctx.fillRect(flash.r.x, flash.r.y, flash.r.w, flash.r.h); }
  }
  ctx.restore();
  updateStatus();
}
</script>
