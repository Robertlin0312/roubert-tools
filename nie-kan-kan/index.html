<title>捏看看</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap">
<style>
/* Layout: monochrome studio — rounded image plate left, quiet control column right; stacks on phones. */
:root{
  --bg:#f7f7f7;
  --surface:#ffffff;
  --plate:#ececec;
  --inset:#f1f1f1;
  --ink:#2e2e2e;      /* dark grey instead of pure black */
  --soft:#8b8b8b;
  --rule:#e1e1e1;
  --fill:#bdbdbd;     /* brush slider fill */
  --on-ink:#fafafa;
  --r-sm:8px;--r-md:12px;--r-lg:18px;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f1f1f;--surface:#262626;--plate:#2b2b2b;--inset:#202020;--ink:#e6e6e6;--soft:#8f8f8f;--rule:#3a3a3a;--fill:#5a5a5a;--on-ink:#262626;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f1f1f;--surface:#262626;--plate:#2b2b2b;--inset:#202020;--ink:#e6e6e6;--soft:#8f8f8f;--rule:#3a3a3a;--fill:#5a5a5a;--on-ink:#262626;color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:13px;line-height:1.55}
button,select,input{font:inherit;color:inherit}

.app{min-height:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) 324px;grid-template-rows:auto minmax(0,1fr);
  gap:20px 28px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.app{height:100%;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}}
@media (max-width:899px){.app{grid-template-columns:minmax(0,1fr)}}

header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-weight:700;font-size:20px;letter-spacing:.1em}
h1 small{font-weight:300;color:var(--soft);font-size:12px;letter-spacing:.16em;margin-left:10px}
.hbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lang{display:flex;background:var(--plate);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:3px 11px;border-radius:999px;cursor:pointer;font-size:12px;color:var(--soft)}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:var(--r-sm);border:1px solid var(--rule);background:var(--surface);cursor:pointer;font-size:13px;letter-spacing:.03em;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.solid:hover{opacity:.88}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn:disabled{opacity:.35;cursor:default}
button:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* plate */
.plate{position:relative;background:var(--plate);border-radius:var(--r-lg);display:grid;place-items:center;overflow:hidden;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none}
@media (max-width:899px){.plate{height:64vh}}
.plate.drag::after{content:attr(data-drop);position:absolute;inset:14px;border:1.5px dashed var(--ink);border-radius:var(--r-md);display:grid;place-items:center;letter-spacing:.2em;background:color-mix(in srgb,var(--plate) 85%,transparent)}
#gl{display:block;max-width:100%;cursor:none;border-radius:4px}
.plate.headmode #gl{cursor:move}
.ring{position:absolute;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%)}
#brush{border:1px solid rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(0,0,0,.3)}
#zone{border:2px dashed #ff48b0;box-shadow:0 0 0 1px rgba(255,255,255,.55);transition:opacity .15s}
#zone.dim{opacity:.35}
#zone::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#ff48b0;box-shadow:0 0 0 2px #fff}
#head{border:1.5px dotted rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
#head i{position:absolute;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
#head .hx{right:-6px;top:50%;margin-top:-5.5px}
#head .hy{top:-6px;left:50%;margin-left:-5.5px}
.caption{position:absolute;left:14px;bottom:12px;font-size:11px;letter-spacing:.1em;color:var(--soft);pointer-events:none;background:color-mix(in srgb,var(--plate) 80%,transparent);padding:2px 8px;border-radius:999px}
.caption.r{left:auto;right:14px}
.rec{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);border-radius:999px;padding:5px 14px;font-size:12px;letter-spacing:.08em;display:flex;gap:8px;align-items:center}
.rec i{width:8px;height:8px;border-radius:50%;background:#e04a3a;display:block}

/* column */
.col{display:flex;flex-direction:column;gap:14px;min-width:0;overflow-y:auto;padding:2px 4px 8px 2px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:8px}
.card h2{margin:0 0 4px;font-size:12px;font-weight:500;letter-spacing:.14em;color:var(--soft);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card[data-mode]{cursor:default;transition:border-color .15s,box-shadow .15s}
.card[data-mode].active{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.card[data-mode].active>h2{color:var(--ink)}
.cbadge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.06em;color:var(--soft);font-weight:400;border:1px solid var(--rule);border-radius:999px;padding:2px 9px 2px 6px;white-space:nowrap}
.cbadge svg{width:14px;height:14px;flex:none}
.card.active .cbadge{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.cbadge .on{display:none}.card.active .cbadge .on{display:inline}.card.active .cbadge .off{display:none}
.row{display:grid;grid-template-columns:5.6em minmax(0,1fr) 3.8em;align-items:center;gap:10px;min-height:28px}
.row label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid transparent;border-radius:6px;font-size:12px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;padding:3px 6px;-moz-appearance:textfield;appearance:textfield}
.num::-webkit-inner-spin-button,.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.num:hover{border-color:var(--rule)}
.num:focus{outline:none;border-color:var(--ink)}
input[type=range]{--a:0%;--b:0%;--f:var(--ink);-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--rule) var(--a),var(--f) var(--a) var(--b),var(--rule) var(--b))}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--rule) var(--a),var(--f) var(--a) var(--b),var(--rule) var(--b))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ink);margin-top:-5px;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--ink)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--ink);border:2px solid var(--surface)}
input[type=range]:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
.note{margin:2px 0 0;font-size:11.5px;color:var(--soft);line-height:1.7}
select{background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:4px 6px;font-size:12px;width:100%}

/* brush settings: an inset tray with hollow thumbs, so it reads apart from the face sliders */
.tray{background:var(--inset);border-radius:var(--r-sm);padding:8px 10px 6px;display:flex;flex-direction:column;gap:2px}
.tray .tlabel{font-size:11px;letter-spacing:.12em;color:var(--soft);display:flex;justify-content:space-between}
.tray input[type=range]{--f:var(--fill)}
.tray input[type=range]::-webkit-slider-thumb{background:var(--inset);border:1.5px solid var(--ink);box-shadow:none;width:12px;height:12px;margin-top:-4.5px}
.tray input[type=range]::-moz-range-thumb{background:var(--inset);border:1.5px solid var(--ink)}
.tray .num{background:var(--surface)}

.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--bg);padding:4px;border-radius:var(--r-sm)}
.seg.two{grid-template-columns:1fr 1fr}
.seg.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.seg.five .tool{font-size:10.5px;white-space:nowrap}
.seg.five .tool:not(:has(svg)){padding:7px 0}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;background:none;border:0;border-radius:6px;cursor:pointer;font-size:11px;letter-spacing:.03em;color:var(--soft)}
.tool svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.two .tool{flex-direction:row;justify-content:center;padding:6px 0;font-size:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chip{background:var(--bg);border:1px solid transparent;border-radius:var(--r-sm);padding:8px 2px;cursor:pointer;font-size:12.5px;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:3px}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.chip svg{width:26px;height:22px;stroke:currentColor;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.chip.rand{grid-column:1/-1;flex-direction:row;justify-content:center;background:none;border-color:var(--rule)}
.step{display:flex;gap:8px;align-items:flex-start;font-size:12px}
.step b{flex:none;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-size:11px;font-weight:500;display:grid;place-items:center;margin-top:1px}
.step .btn{padding:4px 10px;font-size:12px;margin-top:4px}
.foot{display:flex;gap:6px;flex-wrap:wrap}
.foot .btn{flex:1}
#addkey{width:100%}
.tintrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:var(--inset);border-radius:var(--r-sm);padding:8px 10px}
.swatch{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.swatch input{width:26px;height:26px;padding:0;border:1px solid var(--rule);border-radius:6px;background:none;cursor:pointer}
.swatch input::-webkit-color-swatch-wrapper{padding:2px}.swatch input::-webkit-color-swatch{border:0;border-radius:4px}
.sw{display:flex;gap:4px}
.sw button{width:18px;height:18px;border-radius:50%;border:1px solid var(--rule);padding:0;cursor:pointer}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;flex-basis:100%}
.chk input{accent-color:var(--ink);width:15px;height:15px;margin:0}
.keyhead{display:flex;justify-content:space-between;align-items:center}
.link{background:none;border:0;padding:2px 4px;cursor:pointer;font-size:12px;color:var(--soft);border-radius:4px}
.link:hover{color:var(--ink)}
.keys{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;min-height:0}
.keys:empty{display:none}
.key{position:relative;flex:none;width:52px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.key button.th{width:52px;height:64px;padding:0;border:1px solid var(--rule);border-radius:var(--r-sm);overflow:hidden;cursor:pointer;background:var(--plate)}
.key button.th:hover{border-color:var(--ink)}
.key img{width:100%;height:100%;object-fit:cover;display:block}
.key .x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font-size:11px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.key.orig button.th{cursor:default}
.stat{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
kbd{font-size:10.5px;color:var(--soft);font-family:inherit}

/* cover: the user's echo-portrait with Swiss-poster typography on a grid */
.cover{position:absolute;inset:0;z-index:2;overflow:hidden;border-radius:var(--r-lg);background:#eceae6;color:#1c1c1c;
  display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;font-family:var(--sans)}
.cv-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;filter:contrast(1.04)}
.cv-word{grid-column:1;grid-row:1;position:relative;justify-self:start;background:#fafaf8;padding:clamp(10px,2vw,20px) clamp(14px,2.4vw,26px) clamp(8px,1.4vw,14px);
  border-bottom-right-radius:var(--r-md);display:flex;align-items:flex-end;gap:clamp(10px,1.6vw,18px)}
.cv-word h2{margin:0;font-weight:900;font-size:clamp(56px,11vw,150px);line-height:.82;letter-spacing:-.06em}
.cv-word .side{display:flex;flex-direction:column;gap:4px;padding-bottom:.4em;font-size:11px;line-height:1.35;letter-spacing:.14em;text-transform:uppercase}
.cv-word .side b{font-weight:700;letter-spacing:.2em}
.cv-strip{grid-column:2;grid-row:1/4;position:relative;writing-mode:vertical-rl;background:#2b2b2b;color:#f4f4f2;padding:18px 12px;
  font-size:13px;letter-spacing:.28em;line-height:1;display:flex;justify-content:space-between;align-items:center}
body.oncover .col,body.oncover #compare{opacity:.4;pointer-events:none;filter:grayscale(1)}
.cv-strip span:last-child{font-size:10px;letter-spacing:.3em;opacity:.6}
.cv-foot{grid-column:1;grid-row:3;position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 14px 14px 0}
.cv-call{background:#ff48b0;color:#1c1c1c;padding:14px 18px 16px;border-top-right-radius:var(--r-md);max-width:300px;display:flex;flex-direction:column;gap:12px}
.cv-call p{margin:0;font-weight:700;font-size:clamp(18px,2.2vw,26px);line-height:1.15;letter-spacing:-.01em}
.cv-actions{display:flex;gap:8px;flex-wrap:wrap}
.cv-actions .btn{padding:9px 16px;font-size:13.5px;border-color:#1c1c1c;color:#1c1c1c;background:#fafaf8}
.cv-actions .btn.solid{background:#1c1c1c;color:#fafaf8}
.cv-stamp{background:#fafaf8;border-radius:999px;padding:5px 12px;font-size:10.5px;letter-spacing:.16em;font-variant-numeric:tabular-nums}
@media (max-width:560px){.cv-strip{display:none}.cover{grid-template-columns:minmax(0,1fr)}.cv-word .side{display:none}}
.tip{position:fixed;z-index:20;max-width:240px;background:var(--ink);color:var(--on-ink);font-size:12px;line-height:1.55;padding:8px 11px;border-radius:var(--r-sm);pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .12s,transform .12s;box-shadow:0 8px 20px -10px rgba(0,0,0,.45)}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font-weight:500;margin-bottom:2px}
#tiptoggle[aria-pressed="false"]{color:var(--soft)}
#tiptoggle[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:8px 18px;border-radius:999px;font-size:12px;letter-spacing:.04em;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:calc(100% - 48px);text-align:center}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(20,20,20,.55);display:grid;place-items:center;padding:24px;z-index:8}
.modal .box{background:var(--surface);border-radius:var(--r-lg);padding:18px;max-width:min(92vw,560px);display:flex;flex-direction:column;gap:12px}
.modal img,.modal video{max-height:62vh;max-width:100%;object-fit:contain;border-radius:var(--r-sm);background:var(--plate)}
@media (prefers-reduced-motion:reduce){.toast,.btn{transition:none}}
</style>

<div class="app">
  <header>
    <h1><span data-i18n="title">捏看看</span><small data-i18n="subtitle">FACE WARP</small></h1>
    <div class="hbar">
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="zh" aria-pressed="true">中文</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
      <button class="btn" id="tiptoggle" aria-pressed="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4M12 17h.01"/></svg><span data-i18n="tipsBtn">提示</span></button>
      <button class="btn" id="compare" data-i18n="compare">按住看原圖</button>
      <button class="btn solid" id="upload" data-i18n="upload">上傳圖片</button>
    </div>
  </header>

  <div class="plate" id="stage" data-drop="放開以載入圖片">
    <canvas id="gl"></canvas>
    <div class="ring" id="zone"></div>
    <div class="ring" id="head" hidden><i class="hx"></i><i class="hy"></i></div>
    <div class="ring" id="brush" hidden></div>
    <div class="caption" id="badge">範例臉</div>

  b.innerHTML=`<svg viewBox="0 0 24 24"><path d="${h.icon}"/></svg><span></span>`;
  b.onclick=()=>{stopPlay();snap();h.run(S.hlen/100*S.hry,S.hdens,S.hjit/100);uploadField();updSteps();toast(T('hairDone'));};hs.appendChild(b);});

/* ---------- pointer & wheel ---------- */
let down=null,hold=0,last=null;
function toUV(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];}
function showBrush(e){const b=$('#brush');if(tool==='zone'||tool==='head'||recording||cover){b.hidden=true;return;}
  const s=stage.getBoundingClientRect(),d=S.bsize*2;
  b.hidden=false;b.style.left=(e.clientX-s.left)+'px';b.style.top=(e.clientY-s.top)+'px';b.style.width=d+'px';b.style.height=d+'px';}
stage.addEventListener('pointermove',e=>{showBrush(e);
  if(!down)return;const [u,v]=toUV(e);
  if(tool==='zone'){S.cx=clamp(u-down.ou,0,1);S.cy=clamp(v-down.ov,0,1);placeZone();dirty=true;}
  else if(tool==='head'){
    if(down.h==='x')S.hrx=Math.max(.02,Math.abs(u-S.hx)*asp);
    else if(down.h==='y')S.hry=Math.max(.02,Math.abs(v-S.hy));
    else{S.hx=clamp(u-down.ou,0,1);S.hy=clamp(v-down.ov,0,1);}placeZone();}
  else if(tool==='push'||tool==='spike'){const du=u-last[0],dv=v-last[1];if(Math.hypot(du*asp,dv)>.0005){applyBrush(last[0],last[1],du,dv);last=[u,v];}}
  else last=[u,v];
});
stage.addEventListener('pointerleave',()=>{$('#brush').hidden=true;});
stage.addEventListener('pointerdown',e=>{
  if(recording||cover)return;stopPlay();stage.setPointerCapture(e.pointerId);const [u,v]=toUV(e);last=[u,v];
  if(tool==='zone'){snap();const near=Math.hypot((u-S.cx)*asp,v-S.cy)<S.radius/100;down={ou:near?u-S.cx:0,ov:near?v-S.cy:0};
    if(!near){S.cx=u;S.cy=v;placeZone();dirty=true;}}
  else if(tool==='head'){snap();const r=cvRect(),px=e.clientX-cv.getBoundingClientRect().left,py=e.clientY-cv.getBoundingClientRect().top;
    const hxp=(S.hx*r.w+S.hrx*r.h),hyp=(S.hy*r.h-S.hry*r.h);
    if(Math.hypot(px-hxp,py-S.hy*r.h)<14)down={h:'x'};
    else if(Math.hypot(px-S.hx*r.w,py-hyp)<14)down={h:'y'};
    else{const inside=((u-S.hx)*asp/S.hrx)**2+((v-S.hy)/S.hry)**2<1;down={ou:inside?u-S.hx:0,ov:inside?v-S.hy:0};if(!inside){S.hx=u;S.hy=v;placeZone();}}}
  else{snap();down={dir:e.shiftKey?-1:1};if(tool!=='push'&&tool!=='spike'){
    const tick=()=>{if(!down)return;if(tool==='twirl')brushAt('twirl',last[0],last[1],down.dir,0,S.bsize/cvRect().h,S.bstr/100),uploadField();else applyBrush(last[0],last[1],0,0);hold=requestAnimationFrame(tick);};tick();}}
});
const up=()=>{if(down)updSteps();down=null;cancelAnimationFrame(hold);};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
let wheelT=0;
stage.addEventListener('wheel',e=>{if(cover)return;e.preventDefault();if(recording)return;
  if(!wheelT){stopPlay();snap();}clearTimeout(wheelT);wheelT=setTimeout(()=>{wheelT=0;updSteps();},450);
  let dy=e.deltaMode===1?e.deltaY*33:e.deltaY;dy=clamp(dy,-120,120);
  const f=Math.exp(-dy*.004); // ~1.5x per wheel notch, equally fast both ways
  const step=(cur,min)=>f>1?Math.max(Math.ceil(cur*f),cur+1):Math.min(Math.floor(cur*f),cur-1);
  if(tool==='zone')setVal('radius',step(S.radius));
  else if(tool==='head'){S.hrx=clamp(S.hrx*f,.02,2);S.hry=clamp(S.hry*f,.02,2);placeZone();}
  else{setVal('bsize',step(S.bsize));showBrush(e);}
},{passive:false});

/* ---------- compare ---------- */
const cmp=$('#compare');
const on=()=>{bypass=1;dirty=true;cmp.setAttribute('aria-pressed','true');},off=()=>{bypass=0;dirty=true;cmp.setAttribute('aria-pressed','false');};
cmp.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>cmp.addEventListener(t,off));
cmp.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')on();});cmp.addEventListener('keyup',off);

/* ---------- playback & video ---------- */
$$('[data-loop]').forEach(b=>b.onclick=()=>{loopMode=b.dataset.loop;$$('[data-loop]').forEach(x=>x.setAttribute('aria-pressed',x===b));t0=performance.now();});
function startPlay(){frames=buildFrames();if(frames.length<2){toast(T('noSteps'));return false;}
  playing=true;segIdx=-1;t0=performance.now();$('#play').setAttribute('aria-pressed','true');$('#play').textContent=T('stop');placeZone();return true;}
function stopPlay(){if(!playing||recording)return;playing=false;$('#play').setAttribute('aria-pressed','false');$('#play').textContent=T('play');uploadField();placeZone();}
$('#play').onclick=()=>playing?stopPlay():startPlay();
$('#addkey').onclick=addKey;
$$('[data-gmode]').forEach(b=>b.onclick=()=>{stopPlay();snap();S.gmode=+b.dataset.gmode;syncModes();dirty=true;});
$$('[data-tone]').forEach(b=>b.onclick=()=>{stopPlay();snap();S.tone=+b.dataset.tone;syncModes();dirty=true;});
$('#tint').addEventListener('pointerdown',()=>{stopPlay();snap();});
$('#tint').addEventListener('input',e=>{S.tint=e.target.value;S.tone=4;S.trand=0;syncModes();dirty=true;});
$('#tintrand').onchange=e=>{stopPlay();snap();S.trand=e.target.checked?1:0;S.tone=4;syncModes();dirty=true;};
['#ff48b0','#ff7477','#ffe800','#44d62c','#00a95c','#0078bf','#3255a4','#765ba7'].forEach(c=>{const b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label',c);
  b.onclick=()=>{stopPlay();snap();S.tint=c;S.tone=4;S.trand=0;syncModes();dirty=true;};$('#swatches').appendChild(b);});
$$('[data-dmode]').forEach(b=>b.onclick=()=>{stopPlay();snap();S.dmode=+b.dataset.dmode;syncModes();dirty=true;});
$('#reseed').onclick=()=>{stopPlay();snap();S.gseed=Math.floor(Math.random()*997)+1;if(!S.gmode)S.gmode=1;syncModes();dirty=true;};
$('#clearkeys').onclick=()=>{stopPlay();keys.length=0;renderKeys();toast(T('keysCleared'));};
function animate(now){if(playing||dirty)draw(now);requestAnimationFrame(animate);}

function pickMime(){if(!window.MediaRecorder)return null;
  return['video/mp4;codecs=avc1.42E01E','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||null;}
$('#record').onclick=async()=>{
  const mime=pickMime();if(!mime||!cv.captureStream){toast(T('noRec'));return;}
  stopPlay();if(!startPlay())return;
  const ext=mime.includes('mp4')?'mp4':'webm';
  recording=true;placeZone();$('#brush').hidden=true;
  ['#record','#play','#upload'].forEach(s=>$(s).disabled=true);
  const stream=cv.captureStream(30);const chunks=[];
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:10e6});
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  const done=new Promise(r=>rec.onstop=r);
  const dur=timeline().dur;
  $('#recbadge').hidden=false;rec.start(200);t0=performance.now();segIdx=-1;
  const tick=setInterval(()=>{$('#rectext').textContent=T('rec',(Math.max(0,dur-(performance.now()-t0))/1000).toFixed(1));},100);
  await new Promise(r=>setTimeout(r,dur+150));
  clearInterval(tick);rec.stop();await done;stream.getTracks().forEach(t=>t.stop());
  recording=false;$('#recbadge').hidden=true;stopPlay();
  ['#record','#play','#upload'].forEach(s=>$(s).disabled=false);
  offer(new Blob(chunks,{type:mime.split(';')[0]}),'face-warp.'+ext,'video');
};

/* ---------- reset / upload ---------- */
$('#reset').onclick=()=>{stopPlay();snap();field=new Float32Array(G*G*2);uploadField();['bulge','wide','tall','jaw','top','radius'].forEach(k=>S[k]=DEF[k].def);syncAll();placeZone();updSteps();toast(T('resetDone'));};
$('#upload').onclick=()=>$('#file').click();
function loadFile(f){if(!f||!f.type.startsWith('image/')){toast(T('notImage'));return;}
  const url=URL.createObjectURL(f);const im=new Image();
  im.onload=()=>{stopPlay();closeCover();isSample=false;Object.assign(S,{cx:.5,cy:.45,hx:.5,hy:.42,hrx:.22,hry:.3});syncAll();setImage(im,f.name||'image');toast(T('loaded'));};
  im.onerror=()=>toast(T('badImage'));im.src=url;}
$('#cvupload').onclick=()=>$('#file').click();
document.body.classList.add('oncover');
$('#file').onchange=e=>{loadFile(e.target.files[0]);e.target.value='';};
['dragenter','dragover'].forEach(t=>stage.addEventListener(t,e=>{e.preventDefault();stage.classList.add('drag');}));
['dragleave','drop'].forEach(t=>stage.addEventListener(t,e=>{e.preventDefault();stage.classList.remove('drag');}));
stage.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
window.addEventListener('paste',e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it)loadFile(it.getAsFile());});

/* ---------- save ---------- */
let dl=null;window.claude?.use?.('downloads').then(x=>dl=x).catch(()=>{});
async function offer(blob,name,kind){
  if(dl){try{await dl.save({filename:name,data:blob});toast(T('saved'));return;}catch(err){if(err?.code==='declined')return;}}
  const m=$('#modal-media');m.innerHTML='';const url=URL.createObjectURL(blob);
  const el=document.createElement(kind==='video'?'video':'img');el.src=url;
  if(kind==='video'){el.controls=true;el.loop=true;el.autoplay=true;el.muted=true;el.playsInline=true;}
  m.appendChild(el);$('#modal-note').textContent=T(kind==='video'?'saveVid':'saveImg');$('#modal').hidden=false;
}
$('#save').onclick=()=>{stopPlay();const was=bypass;bypass=0;draw(performance.now());
  cv.toBlob(blob=>{bypass=was;dirty=true;if(!blob){toast(T('exportFail'));return;}offer(blob,'face-warp.png','image');},'image/png');};
$('#modal-close').onclick=()=>{$('#modal').hidden=true;$('#modal-media').innerHTML='';};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200);}


/* ---------- hover tips ---------- */
let tipsOn=true;try{if(localStorage.getItem('fw-tips')==='0')tipsOn=false;}catch(e){}
function assignTips(){
  const m=[['#compare','compare'],['#upload','upload'],['#cvupload','upload'],['#tiptoggle','tiptoggle'],['#gohead','gohead'],['#reseed','reseed'],
    ['#tint','tint'],['#tintrand','tintrand'],['#addkey','addkey'],['#play','play'],['#record','record'],['#undo','undo'],['#reset','reset'],['#save','save']];
  m.forEach(([q,k])=>{const e=$(q);if(e)(q==='#tint'||q==='#tintrand'?e.parentNode:e).dataset.tip=k;});
  $$('[data-tool]').forEach(b=>b.dataset.tip='tool_'+b.dataset.tool);
  $$('[data-gmode]').forEach(b=>b.dataset.tip='g'+b.dataset.gmode);
  $$('[data-dmode]').forEach(b=>b.dataset.tip='d'+b.dataset.dmode);
  $$('[data-tone]').forEach(b=>b.dataset.tip='tn'+b.dataset.tone);
  $$('[data-loop]').forEach(b=>b.dataset.tip=b.dataset.loop);
  $$('#swatches button').forEach(b=>b.dataset.tip='sw');
  $$('#hairstyles .chip').forEach(b=>b.dataset.tip='hair');
  $$('#presets .chip').forEach(b=>b.dataset.tip=b.classList.contains('rand')?'rand':'preset');
}
const tipEl=$('#tip');let tipTarget=null;
function hideTip(){tipEl.classList.remove('on');tipTarget=null;}
document.addEventListener('pointerover',e=>{
  if(!tipsOn||e.pointerType==='touch')return;const t=e.target.closest('[data-tip]');if(!t||t===tipTarget)return;
  const txt=TIPS[lang][t.dataset.tip];if(!txt){hideTip();return;}
  tipTarget=t;const label=(t.textContent||'').trim();
  tipEl.innerHTML='';if(label&&label.length<14){const b=document.createElement('b');b.textContent=label;tipEl.appendChild(b);}
  tipEl.appendChild(document.createTextNode(txt));
  const r=t.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight;
  let x=r.left+r.width/2-w/2,y=r.bottom+8;x=clamp(x,8,innerWidth-w-8);if(y+h>innerHeight-8)y=r.top-h-8;
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';tipEl.classList.add('on');
});
document.addEventListener('pointerout',e=>{if(tipTarget&&!tipTarget.contains(e.relatedTarget))hideTip();});
document.addEventListener('pointerdown',hideTip,true);
function syncTipBtn(){$('#tiptoggle').setAttribute('aria-pressed',tipsOn);}
$('#tiptoggle').onclick=()=>{tipsOn=!tipsOn;try{localStorage.setItem('fw-tips',tipsOn?'1':'0');}catch(e){}syncTipBtn();hideTip();toast(T(tipsOn?'tipsOnMsg':'tipsOffMsg'));};

/* ---------- language apply ---------- */
function applyLang(){
  document.documentElement.lang=lang==='zh'?'zh-Hant':'en';document.title=T('title');
  $$('[data-i18n]').forEach(el=>el.textContent=T(el.dataset.i18n));
  for(const k of Object.keys(DEF)){$('#'+k+'-l').textContent=DEF[k][lang];$('#'+k+'-n').setAttribute('aria-label',DEF[k][lang]);}
  $$('#presets .chip').forEach(b=>b.textContent=b.dataset[lang]);
  $$('#hairstyles .chip span').forEach(s=>s.textContent=s.parentNode.dataset[lang]);
  $('#play').textContent=T(playing?'stop':'play');stage.dataset.drop=T('drop');
  if(isSample)$('#badge').textContent=T('sample');
  $$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  placeZone();renderKeys();
}
$$('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('fw-lang',lang);}catch(e){}applyLang();});

/* ---------- sample face ---------- */
function sampleFace(){
  const c=document.createElement('canvas');c.width=900;c.height=1150;const x=c.getContext('2d');
  x.fillStyle='#d9d9d6';x.fillRect(0,0,900,1150);x.translate(50,150);
  const skin=g=>{g.addColorStop(0,'#efcdb4');g.addColorStop(.6,'#d39c7c');g.addColorStop(1,'#a96c50');return g;};
  x.fillStyle=skin(x.createLinearGradient(0,700,0,1000));x.beginPath();x.moveTo(290,700);x.quadraticCurveTo(300,900,250,1000);x.lineTo(550,1000);x.quadraticCurveTo(500,900,510,700);x.fill();
  x.fillStyle='#cc9070';[[175,1],[625,-1]].forEach(([ex,s])=>{x.beginPath();x.ellipse(ex,500,38,70,s*.15,0,7);x.fill();});
  x.fillStyle=skin(x.createRadialGradient(360,380,40,400,480,330));x.beginPath();
  x.moveTo(400,140);x.bezierCurveTo(560,140,630,260,625,440);x.bezierCurveTo(620,600,560,740,400,790);
  x.bezierCurveTo(240,740,180,600,175,440);x.bezierCurveTo(170,260,240,140,400,140);x.fill();
  x.fillStyle='#3a3330';x.beginPath();x.moveTo(178,400);x.bezierCurveTo(170,240,250,128,400,128);x.bezierCurveTo(550,128,630,240,622,400);
  x.bezierCurveTo(600,320,560,270,470,262);x.bezierCurveTo(400,258,330,262,300,272);x.bezierCurveTo(240,290,200,330,178,400);x.fill();
  [315,485].forEach(ex=>{
    x.fillStyle='#f7efe8';x.beginPath();x.ellipse(ex,470,46,20,0,0,7);x.fill();
    x.fillStyle='#5e7380';x.beginPath();x.arc(ex,470,17,0,7);x.fill();
    x.fillStyle='#16202a';x.beginPath();x.arc(ex,470,7,0,7);x.fill();
    x.fillStyle='#fff';x.beginPath();x.arc(ex+6,464,4,0,7);x.fill();
    x.strokeStyle='#7d4a33';x.lineWidth=4;x.beginPath();x.ellipse(ex,470,48,22,0,Math.PI*1.08,Math.PI*1.92);x.stroke();
    x.strokeStyle='#3a3330';x.lineWidth=11;x.lineCap='round';x.beginPath();x.moveTo(ex-48,418);x.quadraticCurveTo(ex,398,ex+48,414);x.stroke();});
  x.fillStyle='rgba(120,65,40,.3)';x.beginPath();x.moveTo(385,480);x.quadraticCurveTo(372,560,350,590);x.quadraticCurveTo(400,612,450,590);x.quadraticCurveTo(428,560,415,480);x.fill();
  x.fillStyle='#6f3a26';[[378,594],[422,594]].forEach(([a,b])=>{x.beginPath();x.ellipse(a,b,11,6,0,0,7);x.fill();});
  x.fillStyle='rgba(255,235,215,.4)';x.beginPath();x.ellipse(400,555,12,30,0,0,7);x.fill();
  x.fillStyle='#b0614c';x.beginPath();x.moveTo(335,668);x.quadraticCurveTo(400,645,465,668);x.quadraticCurveTo(400,705,335,668);x.fill();
  x.strokeStyle='#5e2a1c';x.lineWidth=3;x.beginPath();x.moveTo(335,668);x.quadraticCurveTo(400,676,465,668);x.stroke();
  return c;
}
$('#pad').dataset.prev='0';
isSample=true;setImage(sampleFace(),T('sample'));
Object.assign(S,{cy:.535,radius:41,hx:.5,hy:.53,hrx:.205,hry:.29});
syncAll();applyLang();assignTips();syncTipBtn();setTool('zone');requestAnimationFrame(animate);
})();
